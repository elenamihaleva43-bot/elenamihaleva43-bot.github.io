<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренажер · План местности 1 · ΤΕΤΡΑΚΤΥΣ</title>
<style>
  :root {
    --bg: #113c38; --panel: rgba(22, 83, 77, 0.6); --bg2: #0b2b27;
    --line: rgba(47, 212, 181, 0.3); --turq: #2fd4b5; --mint: #7fe8c8;
    --gold: #e8c45a; --text: #e0f2ec; --coral: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, rgba(47, 212, 181, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 85% 90%, rgba(47, 212, 181, 0.1) 0%, transparent 40%);
    background-attachment: fixed; color: var(--text);
    font-family: Georgia, serif; padding: 20px; margin: 0;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    overflow-x: hidden;
  }
  
  header {
    position: sticky; top: 0; z-index: 50; width: 100%; max-width: 1100px;
    background: rgba(17, 60, 56, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 15px 20px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 0 0 18px 18px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dots { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--gold); line-height: 1; }
  .logo-text { font-family: 'Times New Roman', serif; font-weight: bold; font-size: 20px; color: var(--turq); letter-spacing: 2px; text-shadow: 0 0 12px rgba(47,212,181,0.4); }
  .logo-text small { display: block; font-size: 10px; color: var(--mint); letter-spacing: 3px; }
  
  .header-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; color: var(--mint); font-family: "Courier New", monospace;
  }
  .chip.timer { cursor: pointer; }
  .chip.timer:hover { border-color: var(--turq); }
  .chip.ok { color: #2ecc71; }

  .main-container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; }
  
  .name-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
  }
  .name-block label { color: var(--gold); font-weight: bold; }
  .name-block input {
    flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    font-family: Georgia, serif; font-size: 16px; outline: none;
  }
  .name-block input:focus { border-color: var(--turq); }

  .condition-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    font-size: 15px; line-height: 1.6; color: var(--text);
  }
  .condition-block b { color: var(--gold); }

  .graph-wrap { background: #f2fbf8; border-radius: 12px; padding: 10px; margin: 15px 0; text-align: center; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .graph-wrap svg { min-width: 600px; max-width: 100%; height: auto; display: block; margin: 0 auto; }

  .task-card {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); transition: 0.3s;
  }
  .task-card.solved-ok { border-color: #2ecc71; background: rgba(46, 204, 113, 0.05); }
  .task-card.solved-bad { border-color: var(--coral); background: rgba(255, 107, 107, 0.05); }

  .task-header {
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px;
    border-bottom: 1px solid rgba(47, 212, 181, 0.15); padding-bottom: 12px;
  }
  .task-num {
    background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27;
    font-weight: bold; font-size: 18px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-family: "Courier New", monospace; flex-shrink: 0;
  }
  .task-title { font-size: 15px; color: var(--mint); font-weight: bold; padding-top: 8px; flex: 1; }
  .task-mark { font-size: 24px; margin-left: auto; }
  
  .task-question { font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
  .task-question b { color: var(--gold); }

  .table-task { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  .table-task th, .table-task td { border: 1px solid var(--line); padding: 8px; text-align: center; }
  .table-task th { background: rgba(47, 212, 181, 0.1); color: var(--mint); }
  .table-task input {
    width: 60px; padding: 8px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); text-align: center; outline: none;
    font-family: "Courier New", monospace; font-size: 15px;
  }

  .answer-row { display: flex; gap: 10px; margin-top: 15px; }
  .answer-row input {
    flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); font-size: 16px; font-family: "Courier New", monospace;
    outline: none; transition: 0.3s;
  }
  .answer-row input:focus { border-color: var(--turq); box-shadow: 0 0 10px rgba(47,212,181,0.2); }
  .answer-row input.disabled, .table-task input.disabled { opacity: 0.7; pointer-events: none; background: #061d1a; }
  .answer-row input.correct, .table-task input.correct { border-color: #2ecc71; color: #2ecc71; }
  .answer-row input.wrong, .table-task input.wrong { border-color: var(--coral); color: var(--coral); }

  .correct-answer-note { margin-top: 15px; font-size: 14px; color: var(--coral); font-weight: bold; display: none; }
  .correct-answer-note.show { display: block; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; 
    background: rgba(17, 60, 56, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 15px 20px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; z-index: 10;
  }
  .btn {
    padding: 14px 20px; border: none; border-radius: 12px;
    font-family: Georgia, serif; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27; box-shadow: 0 4px 15px rgba(47,212,181,0.3); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(47,212,181,0.5); }
  .btn-gold { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }
  .btn-gold:hover { background: rgba(232, 196, 90, 0.1); }
  .btn-max { background: linear-gradient(135deg, #2fd4b5, #1a9a82); color: #0b2b27; }

  .summary-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
  }
  .summary-overlay.show { display: flex; }
  .summary-box {
    background: var(--bg); border: 2px solid var(--turq); border-radius: 18px;
    padding: 30px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .summary-title { font-size: 18px; color: var(--mint); letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
  .summary-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .summary-stat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .summary-stat .num { font-family: "Courier New", monospace; font-size: 36px; font-weight: bold; }
  .summary-stat .num.ok { color: #2ecc71; }
  .summary-stat .num.err { color: var(--coral); }
  .summary-stat .num.pct { color: var(--gold); }
  .summary-stat .lbl { font-size: 12px; color: #889fa8; text-transform: uppercase; }
  .summary-line { font-size: 15px; color: var(--text); font-style: italic; }

  @media (max-width: 600px) {
    .task-card { padding: 15px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dots"><span>●</span><span>● ●</span><span>● ● ●</span><span>● ● ● ●</span></div>
    <div class="logo-text">ΤΕΤΡΑΚΤΥΣ<small>ШКОЛА МАТЕМАТИКИ</small></div>
  </div>
  <div class="header-info">
    <div class="chip" id="dateDisplay">📅 --.--.----</div>
    <div class="chip timer" id="timerDisplay" title="Клик — пауза/старт">⏱ 00:00</div>
    <div class="chip ok" id="scoreDisplay">✅ 0 / 5</div>
  </div>
</header>

<div class="main-container">
  <div class="name-block">
    <label>👤 Имя ученика:</label>
    <input type="text" id="studentName" placeholder="Введи имя и фамилию" autocomplete="off">
  </div>

  <div id="content"></div>
</div>

<div class="bottom-bar">
  <button class="btn btn-primary" onclick="checkAll()" id="btnCheck">✅ Проверить</button>
  <button class="btn btn-gold" onclick="startNew()">🔄 Сменить</button>
  <button class="btn btn-max" onclick="sendToMax()">💬 В Макс</button>
</div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-box">
    <div class="summary-title">📊 Результат</div>
    <div class="summary-stats">
      <div class="summary-stat"><span class="num ok" id="statOk">0</span><span class="lbl">✅ верно</span></div>
      <div class="summary-stat"><span class="num err" id="statErr">0</span><span class="lbl">❌ неверно</span></div>
      <div class="summary-stat"><span class="num pct" id="statPercent">0%</span><span class="lbl">📊 процент</span></div>
    </div>
    <div class="summary-line" id="summaryLine">—</div>
    <button class="btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="document.getElementById('summaryOverlay').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
/* ============================================================
   ДАННЫЕ
   ============================================================ */
const NAME_SETS = [
  ['Антоновка', 'Егорка', 'Доломино', 'Ванютино', 'Жилино', 'Горюново', 'Богданово'],
  ['Ясная', 'Камышёвка', 'Майское', 'Хомяково', 'Лягушкино', 'Вятское', 'Куровка'],
  ['Грушёвка', 'Таловка', 'Новая', 'Абрамово', 'Осиновка', 'Зябликово', 'Старая'],
  ['Дивная', 'Калиновка', 'Ровное', 'Ольгино', 'Ёлочки', 'Сосенки', 'Жуки'],
  ['Пирожки', 'Васильево', 'Рябиновка', 'Княжеское', 'Масловка', 'Вёсенка', 'Полянка'],
  ['Захарово', 'Николаево', 'Плодородное', 'Рассвет', 'Шарковка', 'Васильевка', 'Кленовое'],
  ['Луговое', 'Полевое', 'Речное', 'Озёрное', 'Лесное', 'Горное', 'Степное'],
  ['Берёзовка', 'Дубровка', 'Сосновка', 'Кленовка', 'Липовка', 'Вишнёвка', 'Яблоневка'],
  ['Красное', 'Зелёное', 'Синее', 'Белое', 'Чёрное', 'Пёстрое', 'Яркое']
];

const PERSONS = [
  {name:'Таня', who:'с дедушкой'},
  {name:'Полина', who:'с дедушкой'},
  {name:'Никита', who:'с папой'},
  {name:'Саша', who:'с дедушкой'},
  {name:'Гриша', who:'с дедушкой'},
  {name:'Дима', who:'с дедушкой'},
  {name:'Ваня', who:'с дедушкой'},
  {name:'Володя', who:'с дедушкой'},
  {name:'Серёжа', who:'с папой'},
  {name:'Маша', who:'с мамой'},
  {name:'Костя', who:'с дедушкой'}
];

const SPEEDS = [5, 10, 15, 20, 25, 30, 50];

const DIST_SETS = [
  {
    '1-2': 8, '2-3': 4, '3-4': 8, '4-5': 9, '5-6': 6, '6-7': 6,
    '1-4': 20, '2-4': 12, '4-6': 15, '4-7': 21,
    '1-6': 25, '1-7': 29, '2-5': 15, '3-6': 17
  },
  {
    '1-2': 7, '2-3': 2, '3-4': 6, '4-5': 6, '5-6': 2, '6-7': 12,
    '1-4': 15, '2-4': 8, '4-6': 8, '4-7': 20,
    '1-6': 17, '1-7': 25, '2-5': 10, '3-6': 10
  }
];

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr){ return arr[randInt(0, arr.length - 1)]; }
function round1(n){ return Math.round(n * 10) / 10; }
function fmtNum(n){ return String(n).replace('.', ','); }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   ГЕНЕРАЦИЯ
   ============================================================ */
let lastDistIdx = -1;

function generateTask(){
  const names = pick(NAME_SETS).slice();
  const person = pick(PERSONS);

  const speedRoad = pick(SPEEDS);
  let speedPath = pick(SPEEDS);
  while(speedPath === speedRoad) speedPath = pick(SPEEDS);

  let distIdx;
  do {
    distIdx = randInt(0, 1);
  } while (distIdx === lastDistIdx);
  lastDistIdx = distIdx;
  const dist = DIST_SETS[distIdx];

  const digits = shuffle([1, 2, 3, 4, 5, 6, 7]);
  const roleDigit = {
    start: digits[0], mid1: digits[1], mid2: digits[2], finish: digits[3],
    other1: digits[4], other2: digits[5], other3: digits[6]
  };
  const roleName = {
    start: names[0], mid1: names[1], mid2: names[2], finish: names[3],
    other1: names[4], other2: names[5], other3: names[6]
  };

  const others = ['mid1', 'mid2', 'finish', 'other1', 'other2', 'other3'];
  const selected = shuffle(others).slice(0, 4);

  return {
    names, person, speedRoad, speedPath, dist, digits, roleDigit, roleName, selected
  };
}

/* ============================================================
   РЕШАТЕЛЬ
   ============================================================ */
function solve(state){
  const { dist, roleDigit, selected } = state;
  const answers = {};
  const rd = roleDigit;

  answers['1'] = selected.map(role => rd[role]).join('');

  const pairs = [
    { from: rd.start, to: rd.mid1, d: dist['1-2'] },
    { from: rd.mid2, to: rd.finish, d: dist['3-4'] },
    { from: rd.other1, to: rd.other2, d: dist['5-6'] },
    { from: rd.other2, to: rd.other3, d: dist['6-7'] }
  ];
  const pair = pick(pairs);
  answers['2'] = pair.d;
  state._task2Pair = pair;

  const straights = [
    { from: rd.start, to: rd.other2, d: dist['1-6'] },
    { from: rd.start, to: rd.other3, d: dist['1-7'] },
    { from: rd.mid1, to: rd.other1, d: dist['2-5'] },
    { from: rd.mid2, to: rd.other2, d: dist['3-6'] }
  ];
  const straight = pick(straights);
  answers['3'] = straight.d;
  state._task3Straight = straight;

  const d12 = dist['1-2'];
  const d23 = dist['2-3'];
  const d34 = dist['3-4'];
  const d45 = dist['4-5'];
  const d56 = dist['5-6'];
  const d67 = dist['6-7'];
  const d14 = dist['1-4'];
  const d24 = dist['2-4'];
  const d47 = dist['4-7'];
  const d16 = dist['1-6'];
  const d17 = dist['1-7'];
  const d25 = dist['2-5'];
  const d36 = dist['3-6'];
  const d13 = d12 + d23;
  const d57 = d56 + d67;

  const routes = [
    { text: `из деревни <b>${state.roleName.start}</b> в деревню <b>${state.roleName.other3}</b> по просёлочной дороге мимо реки`, segments: [{ d: d17, speed: 'path' }] },
    { text: `из деревни <b>${state.roleName.start}</b> в деревню <b>${state.roleName.other3}</b> через деревню <b>${state.roleName.finish}</b>`, segments: [{ d: d14, speed: 'road' }, { d: d47, speed: 'road' }] },
    { text: `из деревни <b>${state.roleName.start}</b> в деревню <b>${state.roleName.other3}</b> через деревню <b>${state.roleName.other2}</b> мимо пруда`, segments: [{ d: d16, speed: 'path' }, { d: d67, speed: 'road' }] },
    { text: `из деревни <b>${state.roleName.start}</b> в деревню <b>${state.roleName.other3}</b> через деревни <b>${state.roleName.mid2}</b> и <b>${state.roleName.other2}</b> мимо конюшни`, segments: [{ d: d13, speed: 'road' }, { d: d36, speed: 'path' }, { d: d67, speed: 'road' }] },
    { text: `из деревни <b>${state.roleName.start}</b> в деревню <b>${state.roleName.other3}</b> через деревни <b>${state.roleName.mid1}</b> и <b>${state.roleName.other1}</b> мимо конюшни`, segments: [{ d: d12, speed: 'road' }, { d: d25, speed: 'path' }, { d: d57, speed: 'road' }] },
    { text: `из деревни <b>${state.roleName.mid1}</b> в деревню <b>${state.roleName.finish}</b> по шоссе через деревню <b>${state.roleName.mid2}</b>`, segments: [{ d: d24, speed: 'road' }] },
    { text: `из деревни <b>${state.roleName.mid2}</b> в деревню <b>${state.roleName.other2}</b> по просёлочной дороге мимо конюшни`, segments: [{ d: d36, speed: 'path' }] },
    { text: `из деревни <b>${state.roleName.mid1}</b> в деревню <b>${state.roleName.other1}</b> по просёлочной дороге мимо конюшни`, segments: [{ d: d25, speed: 'path' }] },
    { text: `из деревни <b>${state.roleName.other1}</b> в деревню <b>${state.roleName.other3}</b> по шоссе`, segments: [{ d: d57, speed: 'road' }] },
    { text: `из деревни <b>${state.roleName.other2}</b> в деревню <b>${state.roleName.other3}</b> по шоссе`, segments: [{ d: d67, speed: 'road' }] }
  ];

  const route = pick(routes);
  let totalMin = 0;
  route.segments.forEach(seg => {
    const sp = seg.speed === 'road' ? state.speedRoad : state.speedPath;
    totalMin += seg.d / sp * 60;
  });
  answers['4'] = round1(totalMin);
  state._task4Route = route;

  const R_path = 8.2;
  const R_road = round1(d17 * R_path / (d14 + d47));
  answers['5'] = R_road;
  state._task5 = { R_path, R_road, d17, d14, d47 };

  return answers;
}

/* ============================================================
   РЕНДЕР SVG
   ============================================================ */
function renderSVG(state){
  const rd = state.roleDigit;
  return `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="250 30 860 520" style="background:#f7fcfa;border-radius:10px;">
      <style>
        .road { stroke: #000000; stroke-width: 3; fill: none; }
        .road-dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
        .drop { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        .drop-number { font-family: 'Georgia', serif; font-size: 16px; font-weight: 700; fill: #2d2b4e; text-anchor: middle; dominant-baseline: central; }
        .river { stroke: #1a3a6a; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .pond { fill: #87CEEB; stroke: #1a3a6a; stroke-width: 1.5; }
        .horse-emoji { font-size: 28px; }
        .legend-text { font-family: 'Georgia', serif; font-size: 14px; fill: #2d2b4e; }
        .legend-line { stroke: #000000; stroke-width: 2; fill: none; }
        .legend-line-dashed { stroke: #000000; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
        .legend-line-river { stroke: #1a3a6a; stroke-width: 4; fill: none; }
      </style>
      <rect x="250" y="30" width="860" height="520" fill="#f7fcfa"/>
      <g class="road">
        <line x1="300" y1="100" x2="780" y2="100"/>
        <line x1="300" y1="100" x2="300" y2="500"/>
      </g>
      <line x1="300" y1="185" x2="460" y2="100" class="road-dashed"/>
      <line x1="300" y1="295" x2="380" y2="100" class="road-dashed"/>
      <line x1="300" y1="295" x2="640" y2="100" class="road-dashed"/>
      <line x1="300" y1="405" x2="640" y2="100" class="road-dashed"/>
      <path d="M 280,500 C 320,480 340,440 380,420 C 420,400 440,360 480,340 C 520,320 540,280 580,260 C 600,250 620,230 640,210 C 660,190 670,170 680,150 C 690,130 695,110 690,90 C 685,70 675,60 660,55" class="river"/>
      <ellipse cx="420" cy="185" rx="30" ry="18" class="pond"/>
      <text x="295" y="125" class="horse-emoji">🐴</text>

/* ============================================================
   РЕНДЕР ЗАДАНИЙ
   ============================================================ */
let state = null;
let checked = false;

function render(){
  const { names, person, speedRoad, speedPath, dist, roleDigit, roleName, selected } = state;
  const answers = solve(state);
  const rd = roleDigit;
  const rn = roleName;

  const d12 = dist['1-2'];
  const d23 = dist['2-3'];
  const d24 = dist['2-4'];
  const d45 = dist['4-5'];
  const d46 = dist['4-6'];
  const d57 = dist['5-6'] + dist['6-7'];
  const d13 = d12 + d23;

  let conditionText = `
    ${person.name} ${person.who} на летних каникулах приезжает в гости к дедушке в деревню <b>${rn.start}</b> (на плане обозначена цифрой ${rd.start}). В конце каникул дедушка на машине собирается отвезти ${person.name} на автобусную станцию, которая находится в деревне <b>${rn.other3}</b>. Из <b>${rn.start}</b> в <b>${rn.other3}</b> можно проехать по просёлочной дороге мимо реки. Есть другой путь – по шоссе до деревни <b>${rn.finish}</b>, где нужно повернуть под прямым углом НАЛЕВО на другое шоссе, ведущее в <b>${rn.other3}</b>. Третий маршрут проходит по просёлочной дороге мимо пруда до деревни <b>${rn.other2}</b>, где можно свернуть на шоссе до <b>${rn.other3}</b>.
    Четвёртый маршрут пролегает по шоссе до деревни <b>${rn.mid2}</b>, от <b>${rn.mid2}</b> до <b>${rn.other2}</b> по просёлочной дороге мимо конюшни и от <b>${rn.other2}</b> до <b>${rn.other3}</b> по шоссе. Ещё один маршрут проходит по шоссе до деревни <b>${rn.mid1}</b>, по просёлочной дороге мимо конюшни от <b>${rn.mid1}</b> до <b>${rn.other1}</b> и по шоссе от <b>${rn.other1}</b> до <b>${rn.other3}</b>.
    <br><br>
    Шоссе и просёлочные дороги образуют прямоугольные треугольники.
    <br><br>
    По шоссе ${person.name} ${person.who} едут со скоростью <b>${speedRoad} км/ч</b>, а по просёлочным дорогам – со скоростью <b>${speedPath} км/ч</b>. Расстояние от <b>${rn.start}</b> до <b>${rn.mid2}</b> равно <b>${d13} км</b>, от <b>${rn.mid2}</b> до <b>${rn.mid1}</b> – <b>${d23} км</b>, от <b>${rn.mid1}</b> до <b>${rn.finish}</b> – <b>${d24} км</b>, от <b>${rn.other2}</b> до <b>${rn.finish}</b> – <b>${d46} км</b>, от <b>${rn.finish}</b> до <b>${rn.other1}</b> – <b>${d45} км</b>, а от <b>${rn.other1}</b> до <b>${rn.other3}</b> – <b>${d57} км</b>.
  `;

  let html = `
    <div class="condition-block">
      ${conditionText}
      <div class="graph-wrap">${renderSVG(state)}</div>
    </div>
  `;

  let t1head = '<th>Деревни</th>';
  let t1body = '<td><b>Цифры</b></td>';
  selected.forEach(role => {
    t1head += `<th>${rn[role]}</th>`;
    t1body += `<td><input type="text" id="m-1-${role}" maxlength="1" placeholder="?"></td>`;
  });

  html += `
    <div class="task-card" id="task-1">
      <div class="task-header"><div class="task-num">1</div><div class="task-title">Цифры деревень</div><div class="task-mark" id="mark-1"></div></div>
      <div class="task-question">Пользуясь описанием, определите, какими цифрами на плане обозначены деревни. Заполните таблицу, в бланк ответов перенесите последовательность четырёх цифр без пробелов, запятых.</div>
      <table class="table-task"><thead><tr>${t1head}</tr></thead><tbody><tr>${t1body}</tr></tbody></table>
      <div class="answer-row"><input type="text" id="ans-1" placeholder="4 цифры" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-1"></div>
    </div>
  `;

  const p2 = state._task2Pair;
  const p2FromRole = Object.keys(rd).find(k => rd[k] === p2.from);
  const p2ToRole = Object.keys(rd).find(k => rd[k] === p2.to);
  html += `
    <div class="task-card" id="task-2">
      <div class="task-header"><div class="task-num">2</div><div class="task-title">Расстояние по шоссе</div><div class="task-mark" id="mark-2"></div></div>
      <div class="task-question">Найдите расстояние от деревни <b>${rn[p2FromRole]}</b> до деревни <b>${rn[p2ToRole]}</b> по шоссе. Ответ дайте в километрах.</div>
      <div class="answer-row"><input type="text" id="ans-2" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-2"></div>
    </div>
  `;

  const s3 = state._task3Straight;
  const s3FromRole = Object.keys(rd).find(k => rd[k] === s3.from);
  const s3ToRole = Object.keys(rd).find(k => rd[k] === s3.to);
  html += `
    <div class="task-card" id="task-3">
      <div class="task-header"><div class="task-num">3</div><div class="task-title">Расстояние по прямой</div><div class="task-mark" id="mark-3"></div></div>
      <div class="task-question">Найдите расстояние от деревни <b>${rn[s3FromRole]}</b> до деревни <b>${rn[s3ToRole]}</b> по прямой. Ответ дайте в километрах.</div>
      <div class="answer-row"><input type="text" id="ans-3" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-3"></div>
    </div>
  `;

  const r4 = state._task4Route;
  html += `
    <div class="task-card" id="task-4">
      <div class="task-header"><div class="task-num">4</div><div class="task-title">Время в пути</div><div class="task-mark" id="mark-4"></div></div>
      <div class="task-question">Сколько минут затратят на дорогу ${person.name} ${person.who}, если поедут ${r4.text}?</div>
      <div class="answer-row"><input type="text" id="ans-4" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-4"></div>
    </div>
  `;

  const t5 = state._task5;
  html += `
    <div class="task-card" id="task-5">
      <div class="task-header"><div class="task-num">5</div><div class="task-title">Расход бензина</div><div class="task-mark" id="mark-5"></div></div>
      <div class="task-question">На просёлочных дорогах машина дедушки расходует <b>${fmtNum(t5.R_path)} литра</b> бензина на 100 км. Известно, что на путь из <b>${rn.start}</b> в <b>${rn.other3}</b> через <b>${rn.finish}</b> и путь напрямик ей необходим один и тот же объём бензина. Сколько литров бензина на 100 км машина дедушки расходует на шоссе?</div>
      <div class="answer-row"><input type="text" id="ans-5" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-5"></div>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
  state._answers = answers;
}

/* ============================================================
   НОРМАЛИЗАЦИЯ И ПРОВЕРКА
   ============================================================ */
function normAnswer(s){ return String(s||'').trim().replace(/\s+/g,'').replace(',','.').replace(/[°%кмминлГБгбруб]+$/gi,'').replace(/^0+(?=\d)/,''); }
function checkNumeric(userAns, correctAns){ const u = normAnswer(userAns); const c = normAnswer(correctAns); if(!u) return false; if(u === c) return true; const un = parseFloat(u), cn = parseFloat(c); return (!isNaN(un) && !isNaN(cn) && Math.abs(un - cn) < 0.01); }

function checkAll() {
  const name = document.getElementById('studentName').value.trim();
  if(!name){ alert('Введи имя ученика!'); return; }

  const ans = state._answers;
  let okCount = 0, errCount = 0;

  const task1Ok = (() => {
    const ans1 = document.getElementById('ans-1').value.trim();
    const correctDigits = ans['1'];
    let allFieldsOk = true;
    state.selected.forEach((role, i) => {
      const inp = document.getElementById('m-1-'+role);
      const v = inp.value.trim();
      inp.disabled = true;
      if(v === correctDigits[i]) inp.classList.add('correct');
      else { inp.classList.add('wrong'); allFieldsOk = false; }
    });
    const ansInp = document.getElementById('ans-1');
    ansInp.disabled = true;
    const ansOk = (ans1 === correctDigits);
    ansInp.classList.add(ansOk ? 'correct' : 'wrong');
    return allFieldsOk && ansOk;
  })();

  document.getElementById('mark-1').textContent = task1Ok ? '✅' : '❌';
  document.getElementById('task-1').classList.add(task1Ok ? 'solved-ok' : 'solved-bad');
  if(!task1Ok){
    document.getElementById('note-1').innerHTML = 'Правильный ответ: <b>' + ans['1'] + '</b>';
    document.getElementById('note-1').classList.add('show');
  }
  if(task1Ok) okCount++; else errCount++;

  [2,3,4,5].forEach(n => {
    const inp = document.getElementById('ans-'+n);
    const val = inp.value.trim();
    const isOk = checkNumeric(val, ans[n]);
    inp.classList.add(isOk ? 'correct' : 'wrong');
    inp.disabled = true;
    document.getElementById('mark-'+n).textContent = isOk ? '✅' : '❌';
    document.getElementById('task-'+n).classList.add(isOk ? 'solved-ok' : 'solved-bad');
    if(!isOk){
      document.getElementById('note-'+n).innerHTML = 'Правильный ответ: <b>' + fmtNum(ans[n]) + '</b>';
      document.getElementById('note-'+n).classList.add('show');
    }
    if(isOk) okCount++; else errCount++;
  });

  const percent = Math.round(okCount / 5 * 100);
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statErr').textContent = errCount;
  document.getElementById('statPercent').textContent = percent + '%';
  document.getElementById('summaryLine').textContent = percent >= 80 ? '🌟 Отлично!' : percent >= 50 ? '👍 Хорошо, но можно лучше' : '📚 Стоит повторить';
  document.getElementById('summaryOverlay').classList.add('show');
  document.getElementById('scoreDisplay').textContent = `✅ ${okCount} / 5`;
  
  const btn = document.getElementById('btnCheck');
  btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Проверено';
}

function sendToMax() {
  const name = document.getElementById('studentName').value.trim() || 'Без имени';
  let text = `🗺️ ТРЕНАЖЕР · План местности 1\nУченик: ${name}\nДата: ${new Date().toLocaleString('ru-RU')}\n--------------------------------\n\n`;
  let okCount = 0;
  const ans = state._answers;

  for(let i = 1; i <= 5; i++) {
    let userAns = '';
    let isOk = false;
    if (i === 1) {
      userAns = document.getElementById('ans-1').value.trim();
      isOk = (userAns === ans['1']);
    } else {
      userAns = document.getElementById('ans-'+i).value.trim();
      isOk = checkNumeric(userAns, ans[i]);
    }

    if(userAns !== '') {
      if(isOk) { okCount++; text += `✅ Задача ${i}. Ответ: ${userAns} (верно)\n`; }
      else { text += `❌ Задача ${i}. Ответ: ${userAns} (правильный: ${i === 1 ? ans['1'] : fmtNum(ans[i])})\n`; }
    } else {
      text += `— Задача ${i}. (не решено)\n`;
    }
  }
  text += `\n✅ Итог: ${okCount} из 5 верно`;
  navigator.clipboard.writeText(text).then(() => {
    alert('Отчет скопирован! Открываем чат Макс...');
    window.open('https://max.ru/u/f9LHodD0cOLjga5OFLMq8VyyMVxwRMnAtUTfKxnMebvnxW-IcLDiq4PIfes', '_blank');
  }).catch(err => alert('Ошибка копирования: ' + err));
}

function startNew() {
  checked = false;
  const btn = document.getElementById('btnCheck');
  btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '✅ Проверить'; btn.style.background = '';
  document.getElementById('summaryOverlay').classList.remove('show');
  state = generateTask();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

let timerInterval, timerSeconds = 0, isTimerRunning = true;
window.onload = () => {
  const d = new Date();
  document.getElementById('dateDisplay').textContent = '📅 ' + d.toLocaleDateString('ru-RU');
  timerInterval = setInterval(() => {
    if (isTimerRunning) {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `⏱ ${m}:${s}`;
    }
  }, 1000);
  document.getElementById('timerDisplay').onclick = function() {
    isTimerRunning = !isTimerRunning;
    this.style.opacity = isTimerRunning ? 1 : 0.5;
  };
  const savedName = localStorage.getItem('dz_plan1_name');
  if(savedName) document.getElementById('studentName').value = savedName;
  document.getElementById('studentName').addEventListener('input', (e) => {
    localStorage.setItem('dz_plan1_name', e.target.value);
  });
  startNew();
};
