<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зайка · Умножение и деление · ΤΕΤΡΑΚΤΥΣ</title>
<style>
    :root {
        --teal:        #1abc9c;
        --teal-dark:   #16a085;
        --teal-deep:   #0e7c66;
        --mint:        #7fffd4;
        --gold:        #f4d35e;
        --gold-light:  #ffe89a;
        --coral:       #ff6b6b;
        --text:        #e8f8f5;
        --text-soft:   #b8d8d0;
        --ok:          #2ecc71;
        --err:         #ff6b6b;

        --cell-empty:  rgba(26, 188, 156, 0.18);
        --cell-green:  #2ecc71;
        --cell-red:    #ff6b6b;
        --field-bg:    rgba(10, 42, 51, 0.55);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: Georgia, 'Times New Roman', serif;
        background:
            radial-gradient(ellipse at 15% 10%, rgba(26,188,156,0.22), transparent 55%),
            radial-gradient(ellipse at 85% 90%, rgba(127,255,212,0.15), transparent 55%),
            radial-gradient(ellipse at 50% 50%, rgba(244,211,94,0.06), transparent 70%),
            linear-gradient(160deg, #0a2a33 0%, #0d3b47 50%, #134e5e 100%);
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0 12px 24px;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
    }

    /* ===== ЛИПКАЯ ШАПКА ===== */
    .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: rgba(10, 42, 51, 0.92);
        border-bottom: 2px solid var(--teal-dark);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        flex-wrap: wrap;
    }
    .logo-mini {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(26,188,156,0.10);
        border: 1.5px solid rgba(26,188,156,0.35);
        border-radius: 10px;
        padding: 5px 12px;
    }
    .logo-dots {
        font-size: 11px;
        line-height: 1.1;
        letter-spacing: 4px;
        color: var(--mint);
        font-family: 'Courier New', monospace;
    }
    .logo-text { display: flex; flex-direction: column; }
    .logo-greek {
        font-size: 15px;
        letter-spacing: 3px;
        font-weight: 700;
        color: var(--gold);
        line-height: 1.1;
    }
    .logo-rus {
        font-size: 9px;
        letter-spacing: 2px;
        color: var(--text-soft);
        font-weight: 600;
    }
    .topbar-info {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-family: 'Courier New', monospace;
    }
    .topbar-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        background: rgba(26,188,156,0.12);
        border: 1.5px solid rgba(26,188,156,0.4);
        border-radius: 10px;
        font-size: 13px;
        color: var(--text);
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    .topbar-chip .lbl { font-size: 10px; color: var(--text-soft); letter-spacing: 1.5px; }
    .topbar-chip .val { color: var(--gold); font-weight: 700; font-size: 14px; }
    .topbar-chip .val.timer { color: var(--mint); font-size: 16px; letter-spacing: 2px; }
    .topbar-chip.hidden { display: none; }

    /* ===== КНОПКА ЗВУКА ===== */
    .sound-btn {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(26,188,156,0.12);
        border: 1.5px solid rgba(26,188,156,0.4);
        border-radius: 10px;
        color: var(--mint);
        font-size: 18px;
        cursor: pointer;
        transition: all 0.25s;
        padding: 0;
        line-height: 1;
    }
    .sound-btn:hover {
        background: rgba(26,188,156,0.25);
        transform: scale(1.06);
    }
    .sound-btn.muted {
        color: #6a9a8a;
        border-color: rgba(106,154,138,0.4);
    }

    /* ===== КОНТЕЙНЕР ===== */
    .container {
        max-width: 900px;
        width: 100%;
        background: rgba(10, 42, 51, 0.72);
        border: 2px solid var(--teal-dark);
        border-radius: 24px;
        padding: 22px 26px 18px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 0 60px rgba(26,188,156,0.06);
        backdrop-filter: blur(6px);
        margin-top: 72px;
    }

    /* ===== СТАРТОВЫЙ ЭКРАН ===== */
    .splash {
        text-align: center;
        padding: 10px 0 6px;
    }
    .splash .bunny-big {
        margin: 0 auto 8px;
        animation: bunnyFloat 3s ease-in-out infinite;
    }
    @keyframes bunnyFloat {
        0%,100% { transform: translateY(0) rotate(-2deg); }
        50%     { transform: translateY(-10px) rotate(2deg); }
    }
    .splash h1 {
        font-size: 30px;
        color: var(--gold);
        margin-bottom: 4px;
        text-shadow: 0 0 20px rgba(244,211,94,0.35);
    }
    .splash .sub {
        font-size: 15px;
        color: var(--text-soft);
        font-style: italic;
        margin-bottom: 14px;
    }
    .name-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }
    .name-row label {
        font-size: 14px;
        color: var(--mint);
        font-weight: 700;
        letter-spacing: 1px;
        align-self: center;
    }
    .name-row input {
        padding: 10px 16px;
        font-size: 16px;
        width: 240px;
        border: 2px solid var(--teal);
        border-radius: 12px;
        background: rgba(10,42,51,0.7);
        color: var(--text);
        text-align: center;
        font-family: Georgia, serif;
        outline: none;
        transition: all 0.3s;
    }
    .name-row input::placeholder { color: rgba(184,216,208,0.5); }
    .name-row input:focus {
        border-color: var(--mint);
        box-shadow: 0 0 0 4px rgba(26,188,156,0.2);
    }
    .greeting {
        font-size: 15px;
        color: var(--gold);
        font-weight: 600;
        min-height: 22px;
        margin-bottom: 14px;
        font-style: italic;
    }

    /* ===== ГРУППЫ УРОВНЕЙ ===== */
    .levels-title {
        font-size: 14px;
        letter-spacing: 2px;
        color: var(--mint);
        text-transform: uppercase;
        margin-bottom: 10px;
        font-weight: 700;
    }
    .level-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
    }
    .level-group.combo {
        grid-template-columns: 1fr;
        background: linear-gradient(135deg, rgba(244,211,94,0.10), rgba(26,188,156,0.10));
        border: 1.5px dashed rgba(244,211,94,0.5);
        border-radius: 14px;
        padding: 8px;
    }
    .level-btn {
        padding: 12px 16px;
        border-radius: 12px;
        border: 2px solid rgba(26,188,156,0.4);
        background: rgba(10,42,51,0.6);
        color: var(--mint);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s;
        font-family: Georgia, serif;
        letter-spacing: 0.5px;
    }
    .level-btn:hover {
        background: rgba(26,188,156,0.18);
        border-color: var(--mint);
        transform: translateY(-2px);
    }
    .level-btn.selected {
        background: linear-gradient(135deg, var(--teal), var(--teal-deep));
        color: #04262b;
        border-color: var(--mint);
        box-shadow: 0 4px 16px rgba(26,188,156,0.4);
    }
    .level-btn.combo-btn {
        border-color: var(--gold);
        color: var(--gold-light);
        background: rgba(244,211,94,0.08);
    }
    .level-btn.combo-btn.selected {
        background: linear-gradient(135deg, var(--gold), #d4a91e);
        color: #04262b;
        border-color: var(--gold-light);
        box-shadow: 0 4px 16px rgba(244,211,94,0.5);
    }

    .btn-start {
        margin-top: 18px;
        padding: 14px 48px;
        font-size: 19px;
        font-weight: 700;
        border: 2px solid var(--gold);
        border-radius: 40px;
        background: linear-gradient(135deg, var(--gold), #d4a91e);
        color: #04262b;
        cursor: pointer;
        transition: all 0.3s;
        font-family: Georgia, serif;
        letter-spacing: 1px;
        box-shadow: 0 4px 20px rgba(244,211,94,0.4);
    }
    .btn-start:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 28px rgba(244,211,94,0.6);
    }
    .btn-start:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    /* ===== ИГРА ===== */
    .game-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 10px;
        flex-wrap: wrap;
    }
    .bunny-small {
        width: 60px;
        height: 70px;
        transition: transform 0.3s;
        flex-shrink: 0;
    }
    .bunny-small.happy { animation: bunnyJump 0.5s ease; }
    .bunny-small.sad   { animation: bunnyShake 0.5s ease; }
    @keyframes bunnyJump {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-15px); }
    }
    @keyframes bunnyShake {
        0%,100% { transform: translateX(0); }
        25%     { transform: translateX(-6px); }
        75%     { transform: translateX(6px); }
    }
    .game-title {
        text-align: center;
    }
    .game-title h2 {
        font-size: 22px;
        color: var(--gold);
    }
    .game-title .level-info {
        font-size: 13px;
        color: var(--text-soft);
        margin-top: 2px;
    }
    .game-title .level-info b { color: var(--mint); }

    .stats {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
    }
    .stat-box {
        background: rgba(10,42,51,0.6);
        border: 1.5px solid rgba(26,188,156,0.4);
        border-radius: 10px;
        padding: 5px 12px;
        min-width: 65px;
        text-align: center;
    }
    .stat-label { font-size: 9px; color: var(--text-soft); letter-spacing: 1px; }
    .stat-value { font-size: 17px; font-weight: 700; color: var(--mint); font-family: 'Courier New', monospace; }

    .progress-bar {
        width: 100%;
        max-width: 700px;
        height: 8px;
        background: rgba(10,42,51,0.6);
        border-radius: 4px;
        margin: 6px auto 12px;
        overflow: hidden;
        border: 1px solid rgba(26,188,156,0.3);
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--mint));
        transition: width 0.5s;
        border-radius: 4px;
    }

    .field-container {
        background: var(--field-bg);
        border-radius: 16px;
        padding: 12px 10px;
        margin-bottom: 10px;
        border: 2px solid rgba(26,188,156,0.4);
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 4px;
        max-width: 100%;
        margin: 0 auto;
    }
    .cell {
        aspect-ratio: 1;
        background: var(--cell-empty);
        border: 2px solid rgba(26,188,156,0.4);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: clamp(10px, 1.5vw, 13px);
        color: var(--text-soft);
        transition: background 0.3s, border-color 0.3s;
        position: relative;
        min-height: 40px;
        font-family: 'Courier New', monospace;
    }
    .cell.green { background: var(--cell-green); border-color: #1e8449; color: #fff; }
    .cell.red   { background: var(--cell-red);   border-color: #c0392b; color: #fff; }
    .cell.finish {
        background: linear-gradient(135deg, var(--gold), #d4a91e);
        border-color: var(--gold-light);
        color: #04262b;
        font-size: 20px;
        animation: finishGlow 1.2s infinite;
    }
    @keyframes finishGlow {
        0%,100% { box-shadow: 0 0 8px rgba(244,211,94,0.5); }
        50%     { box-shadow: 0 0 22px rgba(244,211,94,1); }
    }
    .cell.player {
        border-color: var(--gold);
        background: rgba(244,211,94,0.35);
        box-shadow: 0 0 16px rgba(244,211,94,0.7);
        z-index: 3;
        animation: playerPulse 0.7s infinite;
        font-size: 0;
    }
    @keyframes playerPulse {
        0%,100% { box-shadow: 0 0 10px rgba(244,211,94,0.5); }
        50%     { box-shadow: 0 0 24px rgba(244,211,94,1); }
    }
    .cell.player::after {
        content: '🐰';
        font-size: 24px;
        position: absolute;
        animation: bunnyIdle 2s infinite;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    }
    @keyframes bunnyIdle {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-3px); }
    }
    .cell.player.bunny-happy::after { animation: bunnyBounce 0.4s ease; }
    .cell.player.bunny-sad::after   { animation: bunnyShake 0.5s ease; }
    @keyframes bunnyBounce {
        0%,100% { transform: translateY(0) scale(1); }
        50%     { transform: translateY(-12px) scale(1.2); }
    }
    .cell.step-trail {
        animation: stepTrail 0.5s ease-out;
    }
    @keyframes stepTrail {
        0%   { background: rgba(244,211,94,0.5); box-shadow: 0 0 12px rgba(244,211,94,0.7); }
        100% { background: var(--cell-empty); box-shadow: none; }
    }

    /* ===== КУБИК ===== */
    .dice-area { margin: 8px 0; text-align: center; }
    .dice-container {
        display: inline-block;
        cursor: pointer;
        perspective: 200px;
    }
    .dice {
        width: 64px;
        height: 64px;
        background: #f7fcfa;
        border-radius: 12px;
        position: relative;
        box-shadow: 0 5px 18px rgba(0,0,0,0.5);
        border: 3px solid var(--teal-dark);
    }
    .dice:hover { border-color: var(--gold); box-shadow: 0 6px 22px rgba(244,211,94,0.5); }
    .dice.rolling { animation: diceRoll3D 0.7s ease-out; }
    @keyframes diceRoll3D {
        0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
        30%  { transform: rotateX(250deg) rotateY(160deg) rotateZ(90deg) scale(1.15); }
        60%  { transform: rotateX(480deg) rotateY(320deg) rotateZ(190deg) scale(1.1); }
        100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(360deg) scale(1); }
    }
    .dot {
        position: absolute;
        width: 11px;
        height: 11px;
        background: var(--teal-deep);
        border-radius: 50%;
    }
    .dice-label { color: var(--text-soft); font-size: 11px; margin-top: 6px; letter-spacing: 1px; }

    /* ===== ПАНЕЛЬ ВОПРОСА ===== */
    .question-panel {
        background: rgba(10,42,51,0.75);
        border: 2px solid rgba(26,188,156,0.5);
        border-radius: 14px;
        padding: 14px;
        margin-top: 6px;
        transition: all 0.3s;
    }
    .question-panel.showing {
        border-color: var(--gold);
        box-shadow: 0 0 20px rgba(244,211,94,0.3);
    }
    .question-text {
        font-size: clamp(24px, 4.5vw, 34px);
        color: var(--gold);
        margin: 6px 0;
        font-weight: 700;
        letter-spacing: 3px;
        font-family: 'Courier New', monospace;
    }
    .answer-input {
        width: 110px;
        padding: 9px;
        font-size: 22px;
        text-align: center;
        border-radius: 12px;
        border: 2px solid rgba(26,188,156,0.5);
        background: rgba(10,42,51,0.8);
        color: var(--mint);
        outline: none;
        margin: 4px;
        font-weight: 700;
        font-family: 'Courier New', monospace;
    }
    .answer-input:focus {
        border-color: var(--mint);
        box-shadow: 0 0 12px rgba(26,188,156,0.4);
    }
    .btn {
        padding: 10px 22px;
        border-radius: 25px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        transition: all 0.2s;
        margin: 3px;
        font-family: Georgia, serif;
    }
    .btn-check {
        background: linear-gradient(135deg, var(--teal), var(--teal-deep));
        color: #04262b;
        box-shadow: 0 3px 12px rgba(26,188,156,0.4);
    }
    .btn-check:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 5px 18px rgba(26,188,156,0.6);
    }
    .btn-reset {
        background: transparent;
        border: 1.5px solid var(--text-soft);
        color: var(--text-soft);
        font-size: 11px;
        padding: 6px 14px;
    }
    .btn-reset:hover { border-color: var(--mint); color: var(--mint); }

    .message {
        font-size: 15px;
        margin-top: 6px;
        min-height: 22px;
        font-weight: 700;
    }
    .message.correct { color: var(--ok); }
    .message.wrong   { color: var(--err); }

    /* ===== ФИНАЛ ===== */
    .overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.65);
        z-index: 998;
    }
    .result-popup {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(10,42,51,0.97);
        border: 3px solid var(--gold);
        border-radius: 20px;
        padding: 26px 30px;
        text-align: center;
        z-index: 999;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
        animation: popIn 0.3s ease;
        max-width: min(90vw, 460px);
        backdrop-filter: blur(10px);
    }
    @keyframes popIn {
        0%   { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .result-mascot {
        font-size: 60px;
        animation: mascotCelebrate 0.6s ease;
    }
    @keyframes mascotCelebrate {
        0%   { transform: scale(0.3) rotate(-20deg); }
        60%  { transform: scale(1.2) rotate(10deg); }
        100% { transform: scale(1) rotate(0); }
    }
    .result-popup h2 {
        font-size: 24px;
        margin-bottom: 8px;
        color: var(--mint);
    }
    .result-popup h2.win  { color: var(--ok); }
    .result-popup h2.lose { color: var(--err); }
    .result-popup p {
        font-size: 16px;
        margin: 6px 0;
        color: var(--text);
    }
    .result-popup p b { color: var(--gold); }
    .result-popup .row-stats {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 14px 0;
        font-size: 16px;
        font-weight: 700;
        font-family: 'Courier New', monospace;
    }
    .result-popup .row-stats .name { color: var(--mint); }
    .result-popup .row-stats .score { color: var(--gold); }
    .result-popup .btn-check,
    .result-popup .btn-ghost {
        margin-top: 10px;
        display: inline-block;
    }
    .result-popup .btn-ghost {
        background: transparent;
        border: 1.5px solid var(--text-soft);
        color: var(--text-soft);
        padding: 10px 22px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        font-family: Georgia, serif;
    }
    .result-popup .btn-ghost:hover {
        border-color: var(--mint);
        color: var(--mint);
    }

    @media (max-width: 700px) {
        .container { padding: 16px 14px; margin-top: 68px; }
        .splash h1 { font-size: 24px; }
        .level-group { grid-template-columns: 1fr 1fr; gap: 8px; }
        .level-btn { padding: 10px 8px; font-size: 13px; }
        .cell { min-height: 32px; }
        .cell.player::after { font-size: 18px; }
        .dice { width: 56px; height: 56px; }
        .dot { width: 9px; height: 9px; }
        .topbar { padding: 6px 10px; }
        .topbar-chip { font-size: 11px; padding: 4px 9px; }
        .sound-btn { width: 34px; height: 34px; font-size: 16px; }
    }
    @media (max-width: 400px) {
        .splash h1 { font-size: 20px; }
        .level-btn { padding: 8px 6px; font-size: 12px; }
        .game-title h2 { font-size: 18px; }
        .question-text { font-size: 22px; }
        .sound-btn { width: 32px; height: 32px; font-size: 15px; }
    }
</style>
</head>
<body>

<!-- ===== ШАПКА ===== -->
<div class="topbar">
    <div class="logo-mini">
        <div class="logo-dots">● ● ● ●<br>● ● ●<br>● ●<br>●</div>
        <div class="logo-text">
            <div class="logo-greek">ΤΕΤΡΑΚΤΥΣ</div>
            <div class="logo-rus">ЗАЙКА · × и ÷</div>
        </div>
    </div>
    <div class="topbar-info">
        <div class="topbar-chip">
            <span class="lbl">📅</span>
            <span class="val" id="topDate">—</span>
        </div>

    <div class="splash" id="splashScreen">
        <div class="bunny-big" id="splashMascot">

                    <circle cx="41.5" cy="24.5" r="2" fill="#fff"/>
                    <ellipse cx="32" cy="33" rx="4.5" ry="3.5" fill="#ff9999"/>
                    <path id="mouthSmall" d="M27 36 Q32 42 37 36" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <circle cx="16" cy="38" r="6" fill="#ffcccc" opacity="0.5"/>
                    <circle cx="48" cy="38" r="6" fill="#ffcccc" opacity="0.5"/>

        <div class="stats">

            <div class="stat-box"><div class="stat-label">❌ ОШИБОК</div><div class="stat-value" id="wrongCount">0</div></div>
            <div class="stat-box"><div class="stat-label">📊 %</div><div class="stat-value" id="percent">0%</div></div>

            <div class="dice-container" onclick="rollDice()">
                <div class="dice" id="dice">
                    <div class="dot" id="dot1" style="top:26px;left:26px;"></div>
                    <div class="dot" id="dot2" style="top:8px;left:8px;display:none;"></div>
                    <div class="dot" id="dot3" style="top:8px;left:43px;display:none;"></div>
                    <div class="dot" id="dot4" style="top:43px;left:8px;display:none;"></div>
                    <div class="dot" id="dot5" style="top:43px;left:43px;display:none;"></div>
                    <div class="dot" id="dot6" style="top:26px;left:8px;display:none;"></div>
                    <div class="dot" id="dot7" style="top:26px;left:43px;display:none;"></div>
                </div>
            </div>
            <div class="dice-label">🎯 Нажми на кубик!</div>
        </div>

        <div class="question-panel" id="questionPanel" style="display:none;">
            <div class="question-text" id="qText"></div>
            <input type="number" class="answer-input" id="answerInput" placeholder="?">

            <button class="btn btn-check" onclick="checkAnswer()">✅ Проверить</button>
        </div>

        <div class="message" id="message"></div>
        <div style="text-align: center;">
            <button class="btn btn-reset" onclick="goToSplash()">🏠 К уровням</button>
        </div>

<script>
// ============================================================
//  ДАТА
// ============================================================
(function() {
    const d = new Date();
    document.getElementById('topDate').textContent =
        String(d.getDate()).padStart(2, '0') + '.' +
        String(d.getMonth() + 1).padStart(2, '0') + '.' +
        d.getFullYear();
})();

// ============================================================
//  ЗВУК — вкл/выкл
// ============================================================
let soundOn = true;
try {
    const saved = localStorage.getItem('zayka_sound');
    if (saved === 'off') soundOn = false;
} catch (e) {}

const soundBtn = document.getElementById('soundBtn');
function updateSoundBtn() {
    if (soundOn) {
        soundBtn.textContent = '🔊';
        soundBtn.classList.remove('muted');
        soundBtn.title = 'Выключить звук';
    } else {
        soundBtn.textContent = '🔇';
        soundBtn.classList.add('muted');
        soundBtn.title = 'Включить звук';
    }
}
soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem('zayka_sound', soundOn ? 'on' : 'off'); } catch (e) {}
    updateSoundBtn();
});
updateSoundBtn();

// ============================================================
//  ТАЙМЕР
// ============================================================
let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
        timerSeconds++;
        const m = Math.floor(timerSeconds / 60);
        const s = timerSeconds % 60;
        document.getElementById('topTimer').textContent =
            String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }, 1000);
}
function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerRunning = false;
}
function resetTimer() {
    stopTimer();
    timerSeconds = 0;
    document.getElementById('topTimer').textContent = '00:00';
}

// ============================================================
//  УРОВНИ (ГРУППЫ)
// ============================================================
const LEVELS = [];
for (let n = 2; n <= 9; n++) {
    LEVELS.push({ id: `mul_${n}`, type: 'mul', bases: [n], label: `× ${n}` });
    LEVELS.push({ id: `div_${n}`, type: 'div', bases: [n], label: `÷ ${n}` });
    if (n >= 3) {
        const bases = [];
        for (let k = 2; k <= n; k++) bases.push(k);
        LEVELS.push({ id: `combo_${n}`, type: 'combo', bases, label: `🌟 ×÷ 2-${n}`, combo: true });
    }
}

// ============================================================
//  ИМЯ И УРОВЕНЬ
// ============================================================
let playerName = '';
let selectedLevel = null;

const nameInput = document.getElementById('studentName');
const greeting = document.getElementById('greetingText');
const startBtn = document.getElementById('startBtn');

nameInput.addEventListener('input', () => {
    playerName = nameInput.value.trim();
    if (playerName) {
        greeting.textContent = `👋 Привет, ${playerName}! Выбери уровень.`;
        greeting.style.color = '#2ecc71';
    } else {
        greeting.textContent = '';
    }
    checkReady();
});

function checkReady() {
    startBtn.disabled = !(playerName && selectedLevel);
}

function renderLevels() {
    const container = document.getElementById('levelsContainer');
    container.innerHTML = '';
    for (let n = 2; n <= 9; n++) {
        const group = document.createElement('div');
        group.className = 'level-group';

        const mulBtn = makeLevelButton(`mul_${n}`, `× ${n}`, false);
        const divBtn = makeLevelButton(`div_${n}`, `÷ ${n}`, false);
        group.appendChild(mulBtn);
        group.appendChild(divBtn);
        container.appendChild(group);

        if (n >= 3) {
            const comboGroup = document.createElement('div');
            comboGroup.className = 'level-group combo';
            const comboBtn = makeLevelButton(`combo_${n}`, `🌟 КОМБО × ÷ · 2-${n}`, true);
            comboGroup.appendChild(comboBtn);
            container.appendChild(comboGroup);
        }
    }
}

function makeLevelButton(id, label, isCombo) {
    const btn = document.createElement('button');
    btn.className = 'level-btn' + (isCombo ? ' combo-btn' : '');
    btn.textContent = label;
    btn.dataset.levelId = id;
    btn.addEventListener('click', () => {
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedLevel = LEVELS.find(l => l.id === id);
        checkReady();
    });
    return btn;
}

renderLevels();

// ============================================================
//  СТАРТ ИГРЫ
// ============================================================
startBtn.addEventListener('click', () => {
    if (!playerName || !selectedLevel) return;
    document.getElementById('topName').textContent = playerName;
    document.getElementById('topNameChip').classList.remove('hidden');
    document.getElementById('topTimerChip').classList.remove('hidden');
    resetTimer();
    startTimer();
    document.getElementById('splashScreen').style.display = 'none';
    document.getElementById('gameContainer').style.display = 'block';
    startGame();
});

function goToSplash() {
    document.getElementById('gameContainer').style.display = 'none';
    document.getElementById('splashScreen').style.display = 'block';
    stopTimer();
    resetTimer();
}

// ============================================================
//  ЗВУКИ
// ============================================================
let audioCtx;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playNote(freq, startTime, duration, type = 'sine', vol = 0.15) {
    if (!soundOn) return;
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
}
function soundDiceRoll() {
    if (!soundOn) return;
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    for (let i = 0; i < 10; i++) playNote(300 + Math.random() * 400, now + i * 0.06, 0.05, 'triangle', 0.08);
}
function soundDiceHit() { if (soundOn) playNote(150, audioCtx.currentTime, 0.18, 'triangle', 0.22); }
function soundStep() {
    if (!soundOn) return;
    const now = audioCtx.currentTime;
    playNote(660, now, 0.07, 'sine', 0.1);
    playNote(880, now + 0.03, 0.05, 'sine', 0.07);
}
function soundCorrect() {
    if (!soundOn) return;
    const now = audioCtx.currentTime;
    playNote(523, now, 0.15, 'sine', 0.22);
    playNote(659, now + 0.12, 0.13, 'sine', 0.2);
    playNote(784, now + 0.24, 0.18, 'sine', 0.25);
}
function soundWrong() {
    if (!soundOn) return;
    const now = audioCtx.currentTime;
    playNote(200, now, 0.2, 'triangle', 0.18);
    playNote(160, now + 0.15, 0.25, 'triangle', 0.16);
}
function soundWin() {
    if (!soundOn) return;
    const now = audioCtx.currentTime;
    [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => playNote(f, now + i * 0.12, 0.18, 'sine', 0.25));
}
function soundFail() {
    if (!soundOn) return;
    const now = audioCtx.currentTime;
    [440, 370, 330, 280].forEach((f, i) => playNote(f, now + i * 0.2, 0.22, 'triangle', 0.16));
}

// ============================================================
//  ИГРОВАЯ ЛОГИКА
// ============================================================
const TOTAL_CELLS = 30;
let playerPos = 0;
let correctAnswers = 0;
let wrongAnswers = 0;
let cells = [];
let diceValue = 0;
let canRoll = true;
let currentQuestion = null;
let usedQuestions = [];

function startGame() {
    initAudio();
    playerPos = 0;
    correctAnswers = 0;
    wrongAnswers = 0;
    cells = new Array(TOTAL_CELLS).fill('empty');
    diceValue = 0;
    canRoll = true;
    usedQuestions = [];
    document.getElementById('levelInfo').innerHTML = `Уровень: <b>${selectedLevel.label}</b>`;
    renderGrid();
    updateStats();
    showDiceDots(1);
    updateMascotMouth(true);
}

function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let i = 0; i < TOTAL_CELLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        if (i === playerPos) cell.classList.add('player');
        if (cells[i] === 'green') cell.classList.add('green');
        if (cells[i] === 'red')   cell.classList.add('red');
        if (i === TOTAL_CELLS - 1) cell.classList.add('finish');
        if (i !== playerPos) {
            cell.textContent = (i === TOTAL_CELLS - 1) ? '🏆' : (i + 1);
        }
        grid.appendChild(cell);
    }
}

function updateStats() {
    document.getElementById('correctCount').textContent = correctAnswers;
    document.getElementById('wrongCount').textContent = wrongAnswers;
    const total = correctAnswers + wrongAnswers;
    const percent = total > 0 ? Math.round((correctAnswers / total) * 100) : 0;
    document.getElementById('percent').textContent = percent + '%';
    document.getElementById('posDisplay').textContent = (playerPos + 1) + '/' + TOTAL_CELLS;
    document.getElementById('diceDisplay').textContent = diceValue > 0 ? diceValue : '—';
    const progress = Math.min((playerPos / (TOTAL_CELLS - 1)) * 100, 100);
    document.getElementById('progressFill').style.width = progress + '%';
}

function showDiceDots(value) {
    for (let i = 1; i <= 7; i++) {
        const dot = document.getElementById('dot' + i);
        if (dot) dot.style.display = 'none';
    }
    const positions = {
        1: [[26, 26]],
        2: [[8, 8], [43, 43]],
        3: [[8, 8], [26, 26], [43, 43]],
        4: [[8, 8], [8, 43], [43, 8], [43, 43]],
        5: [[8, 8], [8, 43], [26, 26], [43, 8], [43, 43]],
        6: [[8, 8], [8, 43], [26, 8], [26, 43], [43, 8], [43, 43]]
    };
    positions[value].forEach((pos, i) => {
        const dot = document.getElementById('dot' + (i + 1));
        if (dot) {
            dot.style.display = 'block';
            dot.style.top = pos[0] + 'px';
            dot.style.left = pos[1] + 'px';
        }
    });
}

function rollDice() {
    if (!canRoll) return;
    if (playerPos >= TOTAL_CELLS - 1) return;
    initAudio();
    canRoll = false;
    const dice = document.getElementById('dice');
    dice.classList.add('rolling');
    soundDiceRoll();
    const swap = setInterval(() => showDiceDots(Math.floor(Math.random() * 6) + 1), 80);
    diceValue = Math.floor(Math.random() * 6) + 1;
    setTimeout(() => {
        clearInterval(swap);
        dice.classList.remove('rolling');
        showDiceDots(diceValue);
        soundDiceHit();
        updateStats();
        stepThroughCells(0);
    }, 750);
}

function stepThroughCells(stepCount) {
    if (stepCount >= diceValue || playerPos >= TOTAL_CELLS - 1) {
        if (playerPos >= TOTAL_CELLS - 1) {
            playerPos = TOTAL_CELLS - 1;
            renderGrid();
            updateStats();
            setTimeout(() => showLevelResult(), 500);
            return;
        }
        setTimeout(() => askQuestion(), 300);
        return;
    }
    const oldCell = document.querySelector(`[data-index="${playerPos}"]`);
    if (oldCell) {
        oldCell.classList.add('step-trail');
        setTimeout(() => oldCell.classList.remove('step-trail'), 500);
    }
    playerPos = Math.min(playerPos + 1, TOTAL_CELLS - 1);
    soundStep();
    renderGrid();
    updateStats();
    setTimeout(() => stepThroughCells(stepCount + 1), 350);
}

// ============================================================
//  ВОПРОС
// ============================================================
function generateQuestion() {
    const lvl = selectedLevel;
    let type = lvl.type;
    let base;
    if (type === 'combo') {
        type = Math.random() < 0.5 ? 'mul' : 'div';
        base = lvl.bases[Math.floor(Math.random() * lvl.bases.length)];
    } else {
        base = lvl.bases[0];
    }

    let key, other;
    let tries = 0;
    do {
        other = Math.floor(Math.random() * 10) + 1;
        key = `${type}_${base}_${other}`;
        tries++;
    } while (usedQuestions.includes(key) && tries < 50);
    usedQuestions.push(key);
    if (usedQuestions.length > 40) usedQuestions = usedQuestions.slice(-20);

    if (type === 'mul') {
        return { text: `${base} × ${other} = ?`, answer: base * other };
    } else {
        const product = base * other;
        return { text: `${product} ÷ ${base} = ?`, answer: other };
    }
}

function askQuestion() {
    currentQuestion = generateQuestion();
    document.getElementById('qText').textContent = currentQuestion.text;
    document.getElementById('questionPanel').style.display = 'block';
    document.getElementById('questionPanel').classList.add('showing');
    document.getElementById('answerInput').value = '';
    document.getElementById('answerInput').focus();
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = 'message';
}

function checkAnswer() {
    const input = document.getElementById('answerInput');
    const userAnswer = parseInt(input.value);
    const mascot = document.getElementById('bunnySmall');
    const msg = document.getElementById('message');

    if (isNaN(userAnswer)) {
        msg.textContent = '⚠️ Введи число!';
        msg.className = 'message wrong';
        return;
    }

    if (userAnswer === currentQuestion.answer) {
        correctAnswers++;
        soundCorrect();
        msg.textContent = '✅ Отлично! Молодец!';
        msg.className = 'message correct';
        cells[playerPos] = 'green';
        updateMascotMouth(true);
        if (mascot) {
            mascot.classList.add('happy');
            setTimeout(() => mascot.classList.remove('happy'), 500);
        }
        const pc = document.querySelector('.cell.player');
        if (pc) {
            pc.classList.add('bunny-happy');
            setTimeout(() => pc.classList.remove('bunny-happy'), 500);
        }
    } else {
        wrongAnswers++;
        soundWrong();
        msg.textContent = `❌ Ошибка! Правильно: ${currentQuestion.answer}. Отступаем назад.`;
        msg.className = 'message wrong';
        cells[playerPos] = 'red';
        updateMascotMouth(false);
        if (mascot) {
            mascot.classList.add('sad');
            setTimeout(() => mascot.classList.remove('sad'), 500);
        }
        const pc = document.querySelector('.cell.player');
        if (pc) {
            pc.classList.add('bunny-sad');
            setTimeout(() => pc.classList.remove('bunny-sad'), 500);
        }
        playerPos = Math.max(0, playerPos - 1);
    }

    renderGrid();
    updateStats();
    document.getElementById('questionPanel').classList.remove('showing');
    setTimeout(() => {
        document.getElementById('questionPanel').style.display = 'none';
        canRoll = true;
    }, 700);
}

function updateMascotMouth(happy) {
    const m = document.getElementById('mouthSmall');
    if (m) m.setAttribute('d', happy ? 'M27 34 Q32 42 37 34' : 'M27 39 Q32 33 37 39');
    const m2 = document.getElementById('mouthSplash');
    if (m2) m2.setAttribute('d', happy ? 'M63 72 Q70 82 77 72' : 'M63 76 Q70 70 77 76');
}

// ============================================================
//  ФИНАЛ
// ============================================================
function showLevelResult() {
    stopTimer();
    const total = correctAnswers + wrongAnswers;
    const percent = total > 0 ? Math.round((correctAnswers / total) * 100) : 0;
    const timeStr = document.getElementById('topTimer').textContent;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    const popup = document.createElement('div');
    popup.className = 'result-popup';

    const win = percent >= 75;

    if (win) soundWin(); else soundFail();

    const idx = LEVELS.findIndex(l => l.id === selectedLevel.id);
    const nextLevel = (idx >= 0 && idx < LEVELS.length - 1) ? LEVELS[idx + 1] : null;

    popup.innerHTML = `
        <div class="result-mascot">${win ? '🐰🎉' : '🐰😢'}</div>
        <h2 class="${win ? 'win' : 'lose'}">
            ${win ? (nextLevel ? '🎉 Уровень пройден!' : '🏆 ВСЕ УРОВНИ ПРОЙДЕНЫ!') : '💪 Нужно потренироваться'}
        </h2>
        <p>Верно: <b>${percent}%</b> ${win ? '' : '(нужно ≥ 75%)'}</p>
        <div class="row-stats">
            <span class="name">👤 ${playerName}</span>
            <span class="score">${correctAnswers} / ${total}</span>
        </div>
        <p style="font-size:13px;color:var(--text-soft);">⏱️ Время: ${timeStr}</p>
        ${win && nextLevel ? `<button class="btn-check btn" id="nextBtn">▶ Уровень ${nextLevel.label}</button>` : ''}
        ${!win ? `<button class="btn-check btn" id="retryBtn">🔄 Попробовать ещё раз</button>` : ''}
        <button class="btn-ghost" id="toLevelsBtn">🏠 К уровням</button>
    `;

    document.body.appendChild(overlay);
    document.body.appendChild(popup);

    overlay.onclick = () => {
        overlay.remove();
        popup.remove();
    };

    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            selectedLevel = nextLevel;
            overlay.remove();
            popup.remove();
            startGame();
            resetTimer();
            startTimer();
        });
    }
    const retryBtn = document.getElementById('retryBtn');
    if (retryBtn) {
        retryBtn.addEventListener('click', () => {
            overlay.remove();
            popup.remove();
            startGame();
            resetTimer();
            startTimer();
        });
    }
    document.getElementById('toLevelsBtn').addEventListener('click', () => {
        overlay.remove();
        popup.remove();
        goToSplash();
    });
}

// Enter = проверить
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        const panel = document.getElementById('questionPanel');
        if (panel && panel.style.display !== 'none') {
            checkAnswer();
        }
    }
});
