<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренажер · Геометрия · ΤΕΤΡΑΚΤΥΣ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #113c38; --panel: rgba(22, 83, 77, 0.6); --bg2: #0b2b27;
    --line: rgba(47, 212, 181, 0.3); --turq: #2fd4b5; --mint: #7fe8c8;
    --gold: #e8c45a; --text: #e0f2ec; --coral: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, rgba(47, 212, 181, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 85% 90%, rgba(47, 212, 181, 0.1) 0%, transparent 40%);
    background-attachment: fixed; color: var(--text);
    font-family: Georgia, serif; padding: 20px; margin: 0;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    overflow-x: hidden;
  }
  
  header {
    position: sticky; top: 0; z-index: 50; width: 100%; max-width: 1000px;
    background: rgba(17, 60, 56, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 15px 20px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 0 0 18px 18px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dots { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--gold); line-height: 1; }
  .logo-text { font-family: 'Times New Roman', serif; font-weight: bold; font-size: 20px; color: var(--turq); letter-spacing: 2px; text-shadow: 0 0 12px rgba(47,212,181,0.4); }
  .logo-text small { display: block; font-size: 10px; color: var(--mint); letter-spacing: 3px; }
  
  .header-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; color: var(--mint); font-family: "Courier New", monospace;
  }
  .chip.timer { cursor: pointer; }
  .chip.timer:hover { border-color: var(--turq); }
  .chip.ok { color: #2ecc71; }

  .main-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; }
  
  .name-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
  }
  .name-block label { color: var(--gold); font-weight: bold; }
  .name-block input {
    flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    font-family: Georgia, serif; font-size: 16px; outline: none;
  }
  .name-block input:focus { border-color: var(--turq); }

  .task-card {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); transition: 0.3s;
  }
  .task-card.solved-ok { border-color: #2ecc71; background: rgba(46, 204, 113, 0.05); }
  .task-card.solved-bad { border-color: var(--coral); background: rgba(255, 107, 107, 0.05); }

  .task-header {
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px;
    border-bottom: 1px solid rgba(47, 212, 181, 0.15); padding-bottom: 12px;
  }
  .task-num {
    background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27;
    font-weight: bold; font-size: 18px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-family: "Courier New", monospace; flex-shrink: 0;
  }
  .task-title { font-size: 15px; color: var(--mint); font-weight: bold; padding-top: 8px; flex: 1; }
  .task-mark { font-size: 24px; margin-left: auto; }
  
  .task-question { font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
  .task-question b { color: var(--gold); }

  .answer-row { display: flex; gap: 10px; margin-top: 15px; }
  .answer-row input {
    flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); font-size: 16px; font-family: "Courier New", monospace;
    outline: none; transition: 0.3s;
  }
  .answer-row input:focus { border-color: var(--turq); box-shadow: 0 0 10px rgba(47,212,181,0.2); }
  .answer-row input.disabled { opacity: 0.7; pointer-events: none; background: #061d1a; }
  .answer-row input.correct { border-color: #2ecc71; color: #2ecc71; }
  .answer-row input.wrong { border-color: var(--coral); color: var(--coral); }

  .correct-answer-note { margin-top: 15px; font-size: 14px; color: var(--coral); font-weight: bold; display: none; }
  .correct-answer-note.show { display: block; }

  .radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .radio-item {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
    background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; transition: 0.2s;
  }
  .radio-item:hover { border-color: var(--turq); background: rgba(47, 212, 181, 0.05); }
  .radio-item input { width: 20px; height: 20px; accent-color: var(--turq); cursor: pointer; flex-shrink: 0; margin-top: 2px;}
  .radio-item .radio-text { font-size: 15px; color: var(--text); line-height: 1.5; }
  .radio-item.correct { border-color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
  .radio-item.wrong { border-color: var(--coral); background: rgba(255, 107, 107, 0.1); }
  .radio-item.disabled { cursor: default; opacity: 0.95; }

  .graph-wrap { background: #f2fbf8; border-radius: 12px; padding: 10px; margin: 15px 0; text-align: center; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .graph-wrap svg { min-width: 300px; max-width: 100%; height: auto; display: block; margin: 0 auto; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; 
    background: rgba(17, 60, 56, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 15px 20px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; z-index: 10;
  }
  .btn {
    padding: 14px 20px; border: none; border-radius: 12px;
    font-family: Georgia, serif; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27; box-shadow: 0 4px 15px rgba(47,212,181,0.3); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(47,212,181,0.5); }
  .btn-gold { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }
  .btn-gold:hover { background: rgba(232, 196, 90, 0.1); }
  .btn-max { background: linear-gradient(135deg, #2fd4b5, #1a9a82); color: #0b2b27; }

  .summary-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
  }
  .summary-overlay.show { display: flex; }
  .summary-box {
    background: var(--bg); border: 2px solid var(--turq); border-radius: 18px;
    padding: 30px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .summary-title { font-size: 18px; color: var(--mint); letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
  .summary-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .summary-stat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .summary-stat .num { font-family: "Courier New", monospace; font-size: 36px; font-weight: bold; }
  .summary-stat .num.ok { color: #2ecc71; }
  .summary-stat .num.err { color: var(--coral); }
  .summary-stat .num.pct { color: var(--gold); }
  .summary-stat .lbl { font-size: 12px; color: #889fa8; text-transform: uppercase; }
  .summary-line { font-size: 15px; color: var(--text); font-style: italic; }

  @media (max-width: 600px) {
    .task-card { padding: 15px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dots"><span>●</span><span>● ●</span><span>● ● ●</span><span>● ● ● ●</span></div>
    <div class="logo-text">ΤΕΤΡΑΚΤΥΣ<small>ШКОЛА МАТЕМАТИКИ</small></div>
  </div>
  <div class="header-info">
    <div class="chip" id="dateDisplay">📅 --.--.----</div>
    <div class="chip timer" id="timerDisplay" title="Клик — пауза/старт">⏱ 00:00</div>
    <div class="chip ok" id="scoreDisplay">✅ 0 / 7</div>
  </div>
</header>

<div class="main-container">
  <div class="name-block">
    <label>👤 Имя ученика:</label>
    <input type="text" id="studentName" placeholder="Введи имя и фамилию" autocomplete="off">
  </div>

  <div id="tasksContainer"></div>
</div>

<div class="bottom-bar">
  <button class="btn btn-primary" onclick="checkAll()" id="btnCheck">✅ Проверить</button>
  <button class="btn btn-gold" onclick="startNew()">🔄 Сменить</button>
  <button class="btn btn-max" onclick="sendToMax()">💬 В Макс</button>
</div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-box">
    <div class="summary-title">📊 Результат</div>
    <div class="summary-stats">
      <div class="summary-stat"><span class="num ok" id="statOk">0</span><span class="lbl">✅ верно</span></div>
      <div class="summary-stat"><span class="num err" id="statErr">0</span><span class="lbl">❌ неверно</span></div>
      <div class="summary-stat"><span class="num pct" id="statPercent">0%</span><span class="lbl">📊 процент</span></div>
    </div>
    <div class="summary-line" id="summaryLine">—</div>
    <button class="btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="document.getElementById('summaryOverlay').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
/* ============================================================
   БАЗА УТВЕРЖДЕНИЙ
   ============================================================ */
const TRUE_STATEMENTS = [
  'Точка, лежащая на серединном перпендикуляре к отрезку, равноудалена от концов этого отрезка',
  'Существуют три прямые, которые проходят через одну точку',
  'Вертикальные углы равны',
  'Если точка лежит на биссектрисе угла, то она равноудалена от сторон этого угла',
  'Две различные прямые, перпендикулярные третьей прямой, параллельны',
  'Через точку, не лежащую на данной прямой, можно провести прямую, перпендикулярную этой прямой',
  'Через точку, не лежащую на данной прямой, можно провести прямую, параллельную этой прямой',
  'Через две различные точки на плоскости проходит единственная прямая',
  'Точка, равноудалённая от концов отрезка, лежит на серединном перпендикуляре к этому отрезку',
  'Сумма смежных углов равна 180°',
  'Если две различные прямые на плоскости перпендикулярны третьей прямой, то эти две прямые параллельны',
  'Внутренние накрест лежащие углы, образованные двумя параллельными прямыми и секущей, равны',
  'Если при пересечении двух прямых третьей прямой внутренние накрест лежащие углы равны, то эти прямые параллельны',
  'Если при пересечении двух прямых третьей прямой сумма внутренних односторонних углов равна 180°, то эти прямые параллельны'
];

const FALSE_STATEMENTS = [
  'Смежные углы всегда равны',
  'Всегда один из двух смежных углов острый, а другой тупой',
  'Через заданную точку плоскости можно провести только одну прямую',
  'Если угол острый, то смежный с ним угол также является острым',
  'Две прямые, параллельные третьей прямой, перпендикулярны',
  'Две прямые, перпендикулярные третьей прямой, перпендикулярны',
  'На плоскости существует единственная точка, равноудалённая от концов отрезка',
  'Смежные углы равны'
];

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr){ return arr[randInt(0, arr.length - 1)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = randInt(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   ГЕНЕРАТОРЫ ЗАДАЧ
   ============================================================ */
function genStatementTask(){
  const twoTrue = Math.random() < 0.5;
  let statements = [];
  let correctIdx = -1;

  if(twoTrue){
    const t = shuffle(TRUE_STATEMENTS).slice(0, 2);
    const f = shuffle(FALSE_STATEMENTS).slice(0, 1);
    statements = shuffle([...t, ...f]);
    correctIdx = statements.findIndex(s => f.includes(s));
  } else {
    const t = shuffle(TRUE_STATEMENTS).slice(0, 1);
    const f = shuffle(FALSE_STATEMENTS).slice(0, 2);
    statements = shuffle([...t, ...f]);
    correctIdx = statements.findIndex(s => t.includes(s));
  }

  const question = twoTrue
    ? 'Укажите номер <b>неверного</b> утверждения.'
    : 'Укажите номер <b>верного</b> утверждения.';

  return {
    type: 'statements',
    statements: statements,
    question: question,
    correct: String(correctIdx + 1)
  };
}

function genTask1(){
  const X = pick([30, 60]);
  const alpha = (180 - X) / 3;
  return {
    type: 'task', chart: 1, X: X,
    question: 'Углы, отмеченные на рисунке одной дугой, равны. Найдите угол α. Ответ дайте в градусах.',
    correct: String(alpha)
  };
}

function genTask2(){
  const X = pick([100, 110, 120, 130, 140, 150, 160, 170]);
  const alpha = (180 - X) / 2;
  return {
    type: 'task', chart: 2, X: X,
    question: 'Углы, отмеченные на рисунке одной дугой, равны. Найдите угол α. Ответ дайте в градусах.',
    correct: String(alpha)
  };
}

function genTask3(){
  let a1, a2, a3;
  do {
    a1 = randInt(10, 89); a2 = randInt(91, 170); a3 = 180 - a1 - a2;
  } while (a1 + a2 >= 150 || a3 <= 0);
  return {
    type: 'task', chart: 3, a1: a1, a2: a2,
    question: `Прямые m и n параллельны. Найдите ∠3, если ∠1 = ${a1}°, ∠2 = ${a2}°. Ответ дайте в градусах.`,
    correct: String(a3)
  };
}

function genTask5(){
  const dob = pick([40, 60, 80, 100, 120, 140]);
  const aod = 180 - dob;
  const answer = aod / 2;
  const which = Math.random() < 0.5 ? 'DOK' : 'AOK';
  return {
    type: 'task', chart: 5, dob: dob,
    question: `Найдите величину угла ${which}, если OK – биссектриса угла AOD, ∠DOB = ${dob}°. Ответ дайте в градусах.`,
    correct: String(answer)
  };
}

function genTask6(){
  const dmc = randInt(20, 85);
  const cmb = 2 * dmc;
  const cma = 180 - cmb;
  return {
    type: 'task', chart: 6, dmc: dmc,
    question: `На прямой AB взята точка M. Луч MD – биссектриса угла CMB. Известно, что ∠DMC = ${dmc}°. Найдите угол CMA. Ответ дайте в градусах.`,
    correct: String(cma)
  };
}

function svgTask3(a1, a2){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" style="background:#e8f8f5;border-radius:10px;display:block;width:100%;max-width:420px;height:auto;margin:0 auto;">
    <line x1="30" y1="120" x2="470" y2="120" stroke="#5b3a8c" stroke-width="2"/>
    <line x1="30" y1="320" x2="470" y2="320" stroke="#5b3a8c" stroke-width="2"/>
    <line x1="88.3" y1="400" x2="319.3" y2="0" stroke="#5b3a8c" stroke-width="2"/>
    <line x1="411.7" y1="400" x2="180.7" y2="0" stroke="#5b3a8c" stroke-width="2"/>

let state = null;
let checked = false;

function generateTask(){
  const tasks = [];
  tasks.push(genStatementTask());
  tasks.push(genStatementTask());
  tasks.push(genTask1());
  tasks.push(genTask2());
  tasks.push(genTask3());
  tasks.push(genTask5());
  tasks.push(genTask6());
  return tasks;
}

function render(){
  const container = document.getElementById('tasksContainer');
  let html = '';

  state.forEach((t, i) => {
    const n = i + 1;

    if(t.type === 'statements'){
      let radios = '';
      t.statements.forEach((s, j) => {
        radios += `
          <label class="radio-item" id="radio-${n}-${j+1}">
            <input type="radio" name="q${n}" value="${j+1}">
            <span class="radio-text">${j+1}) ${s}.</span>
          </label>
        `;
      });

      html += `
        <div class="task-card" id="task-${n}">
          <div class="task-header">
            <div class="task-num">${n}</div>
            <div class="task-title">Анализ высказываний</div>
            <div class="task-mark" id="mark-${n}"></div>
          </div>
          <div class="task-question">${t.question}</div>
          <div class="radio-group">${radios}</div>
          <div class="correct-answer-note" id="note-${n}"></div>
        </div>
      `;
    }
    else if(t.type === 'task'){
      let svg = '';
      if(t.chart === 1) svg = svgTask1(t.X);
      else if(t.chart === 2) svg = svgTask2(t.X);
      else if(t.chart === 3) svg = svgTask3(t.a1, t.a2);
      else if(t.chart === 5) svg = svgTask5();
      else if(t.chart === 6) svg = svgTask6();

      html += `
        <div class="task-card" id="task-${n}">
          <div class="task-header">
            <div class="task-num">${n}</div>
            <div class="task-title">Задача</div>

    }
  });

  container.innerHTML = html;
}

/* ============================================================
   ПРОВЕРКА
   ============================================================ */
function normAnswer(s){
  return String(s||'').trim().replace(/\s+/g,'').replace(',','.').replace(/[°%кмминлГБгбрубсмкв]+$/gi,'').replace(/^0+(?=\d)/,'');
}
function checkNumeric(userAns, correctAns){
  const u = normAnswer(userAns);
  const c = normAnswer(correctAns);
  if(!u) return false;
  if(u === c) return true;
  const un = parseFloat(u), cn = parseFloat(c);
  if(!isNaN(un) && !isNaN(cn) && Math.abs(un - cn) < 0.01) return true;
  return false;
}

function checkAll() {
  if(checked) return;
  const name = document.getElementById('studentName').value.trim();
  if(!name){ alert('Введи имя ученика!'); return; }

  let okCount = 0, errCount = 0;

  state.forEach((t, i) => {
    const n = i + 1;
    const block = document.getElementById('task-'+n);
    const mark = document.getElementById('mark-'+n);
    const note = document.getElementById('note-'+n);

    let isOk = false;

    if(t.type === 'statements'){
      const selected = document.querySelector(`input[name="q${n}"]:checked`);
      const userVal = selected ? selected.value : '';
      isOk = (userVal === t.correct);
      for(let j = 1; j <= 3; j++){
        const item = document.getElementById(`radio-${n}-${j}`);
        const inp = item.querySelector('input');
        inp.disabled = true;
        item.classList.add('disabled');
        if(String(j) === t.correct) item.classList.add('correct');
        else if(String(j) === userVal) item.classList.add('wrong');
      }
      if(!isOk){
        note.innerHTML = 'Правильный ответ: <b>' + t.correct + '</b>';
        note.classList.add('show');
      }
    } else {
      const inp = document.getElementById('ans-'+n);
      const val = inp.value.trim();
      isOk = checkNumeric(val, t.correct);
      inp.classList.add(isOk ? 'correct' : 'wrong');
      inp.disabled = true;
      if(!isOk){
        note.innerHTML = 'Правильный ответ: <b>' + t.correct + '</b>';
        note.classList.add('show');
      }
    }

    mark.textContent = isOk ? '✅' : '❌';
    block.classList.add(isOk ? 'solved-ok' : 'solved-bad');
    if(isOk) okCount++; else errCount++;
  });

  const percent = Math.round(okCount / state.length * 100);
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statErr').textContent = errCount;
  document.getElementById('statPercent').textContent = percent + '%';
  document.getElementById('summaryLine').textContent = percent >= 80 ? '🌟 Отлично!' : percent >= 50 ? '👍 Хорошо, но можно лучше' : '📚 Стоит повторить';
  document.getElementById('summaryOverlay').classList.add('show');
  document.getElementById('scoreDisplay').textContent = `✅ ${okCount} / ${state.length}`;
  
  const btn = document.getElementById('btnCheck');
  btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Проверено';
  checked = true;
}

function sendToMax() {
  const name = document.getElementById('studentName').value.trim() || 'Без имени';
  let text = `📐 ТРЕНАЖЕР · Геометрия\nУченик: ${name}\nДата: ${new Date().toLocaleString('ru-RU')}\n--------------------------------\n\n`;
  let okCount = 0;

  state.forEach((t, i) => {
    const n = i + 1;
    let userAns = '';
    let isOk = false;

    if(t.type === 'statements'){
      const selected = document.querySelector(`input[name="q${n}"]:checked`);
      userAns = selected ? selected.value : '—';
      isOk = (userAns === t.correct);
    } else {
      userAns = document.getElementById('ans-'+n).value.trim();
      isOk = checkNumeric(userAns, t.correct);
    }

    if(userAns !== '—' && userAns !== '') {
      if(isOk) { okCount++; text += `✅ Задача ${n}. Ответ: ${userAns} (верно)\n`; }
      else { text += `❌ Задача ${n}. Ответ: ${userAns} (правильный: ${t.correct})\n`; }
    } else {
      text += `— Задача ${n}. (не решено)\n`;
    }
  });

  text += `\n✅ Итог: ${okCount} из ${state.length} верно`;
  navigator.clipboard.writeText(text).then(() => {
    alert('Отчет скопирован! Открываем чат Макс...');
    window.open('https://max.ru/u/f9LHodD0cOLjga5OFLMq8VyyMVxwRMnAtUTfKxnMebvnxW-IcLDiq4PIfes', '_blank');
  }).catch(err => alert('Ошибка копирования: ' + err));
}

function startNew() {
  checked = false;
  const btn = document.getElementById('btnCheck');
  btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '✅ Проверить'; btn.style.background = '';
  document.getElementById('summaryOverlay').classList.remove('show');
  state = generateTask();
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

let timerInterval, timerSeconds = 0, isTimerRunning = true;
window.onload = () => {
  const d = new Date();
  document.getElementById('dateDisplay').textContent = '📅 ' + d.toLocaleDateString('ru-RU');
  timerInterval = setInterval(() => {
    if (isTimerRunning) {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `⏱ ${m}:${s}`;
    }
  }, 1000);
  document.getElementById('timerDisplay').onclick = function() {
    isTimerRunning = !isTimerRunning;
    this.style.opacity = isTimerRunning ? 1 : 0.5;
  };
  const savedName = localStorage.getItem('dz_geom_name');
  if(savedName) document.getElementById('studentName').value = savedName;
  document.getElementById('studentName').addEventListener('input', (e) => {
    localStorage.setItem('dz_geom_name', e.target.value);
  });
  startNew();
};
