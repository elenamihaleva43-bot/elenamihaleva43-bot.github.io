<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренажер · Печка · ΤΕΤΡΑΚΤΥΣ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #113c38; --panel: rgba(22, 83, 77, 0.6); --bg2: #0b2b27;
    --line: rgba(47, 212, 181, 0.3); --turq: #2fd4b5; --mint: #7fe8c8;
    --gold: #e8c45a; --text: #e0f2ec; --coral: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, rgba(47, 212, 181, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 85% 90%, rgba(47, 212, 181, 0.1) 0%, transparent 40%);
    background-attachment: fixed; color: var(--text);
    font-family: Georgia, serif; padding: 20px; margin: 0;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    overflow-x: hidden;
  }
  
  header {
    position: sticky; top: 0; z-index: 50; width: 100%; max-width: 1100px;
    background: rgba(17, 60, 56, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 15px 20px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 0 0 18px 18px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dots { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--gold); line-height: 1; }
  .logo-text { font-family: 'Times New Roman', serif; font-weight: bold; font-size: 20px; color: var(--turq); letter-spacing: 2px; text-shadow: 0 0 12px rgba(47,212,181,0.4); }
  .logo-text small { display: block; font-size: 10px; color: var(--mint); letter-spacing: 3px; }
  
  .header-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; color: var(--mint); font-family: "Courier New", monospace;
  }
  .chip.timer { cursor: pointer; }
  .chip.timer:hover { border-color: var(--turq); }
  .chip.ok { color: #2ecc71; }

  .main-container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; }
  
  .name-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
  }
  .name-block label { color: var(--gold); font-weight: bold; }
  .name-block input {
    flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    font-family: Georgia, serif; font-size: 16px; outline: none;
  }
  .name-block input:focus { border-color: var(--turq); }

  .condition-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    font-size: 15px; line-height: 1.6; color: var(--text);
  }
  .condition-block b { color: var(--gold); }

  .graph-wrap { background: #f2fbf8; border-radius: 12px; padding: 10px; margin: 15px 0; text-align: center; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .graph-wrap svg { min-width: 400px; max-width: 100%; height: auto; display: block; margin: 0 auto; }

  .task-card {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); transition: 0.3s;
  }
  .task-card.solved-ok { border-color: #2ecc71; background: rgba(46, 204, 113, 0.05); }
  .task-card.solved-bad { border-color: var(--coral); background: rgba(255, 107, 107, 0.05); }

  .task-header {
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px;
    border-bottom: 1px solid rgba(47, 212, 181, 0.15); padding-bottom: 12px;
  }
  .task-num {
    background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27;
    font-weight: bold; font-size: 18px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-family: "Courier New", monospace; flex-shrink: 0;
  }
  .task-title { font-size: 15px; color: var(--mint); font-weight: bold; padding-top: 8px; flex: 1; }
  .task-mark { font-size: 24px; margin-left: auto; }
  
  .task-question { font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
  .task-question b { color: var(--gold); }

  .table-task { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  .table-task th, .table-task td { border: 1px solid var(--line); padding: 8px; text-align: center; }
  .table-task th { background: rgba(47, 212, 181, 0.1); color: var(--mint); }
  .table-task input {
    width: 60px; padding: 8px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); text-align: center; outline: none;
    font-family: "Courier New", monospace; font-size: 15px;
  }

  .answer-row { display: flex; gap: 10px; margin-top: 15px; }
  .answer-row input {
    flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); font-size: 16px; font-family: "Courier New", monospace;
    outline: none; transition: 0.3s;
  }
  .answer-row input:focus { border-color: var(--turq); box-shadow: 0 0 10px rgba(47,212,181,0.2); }
  .answer-row input.disabled, .table-task input.disabled { opacity: 0.7; pointer-events: none; background: #061d1a; }
  .answer-row input.correct, .table-task input.correct { border-color: #2ecc71; color: #2ecc71; }
  .answer-row input.wrong, .table-task input.wrong { border-color: var(--coral); color: var(--coral); }

  .correct-answer-note { margin-top: 15px; font-size: 14px; color: var(--coral); font-weight: bold; display: none; }
  .correct-answer-note.show { display: block; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; 
    background: rgba(17, 60, 56, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 15px 20px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; z-index: 10;
  }
  .btn {
    padding: 14px 20px; border: none; border-radius: 12px;
    font-family: Georgia, serif; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27; box-shadow: 0 4px 15px rgba(47,212,181,0.3); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(47,212,181,0.5); }
  .btn-gold { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }
  .btn-gold:hover { background: rgba(232, 196, 90, 0.1); }
  .btn-max { background: linear-gradient(135deg, #2fd4b5, #1a9a82); color: #0b2b27; }

  .summary-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
  }
  .summary-overlay.show { display: flex; }
  .summary-box {
    background: var(--bg); border: 2px solid var(--turq); border-radius: 18px;
    padding: 30px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .summary-title { font-size: 18px; color: var(--mint); letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
  .summary-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .summary-stat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .summary-stat .num { font-family: "Courier New", monospace; font-size: 36px; font-weight: bold; }
  .summary-stat .num.ok { color: #2ecc71; }
  .summary-stat .num.err { color: var(--coral); }
  .summary-stat .num.pct { color: var(--gold); }
  .summary-stat .lbl { font-size: 12px; color: #889fa8; text-transform: uppercase; }
  .summary-line { font-size: 15px; color: var(--text); font-style: italic; }

  @media (max-width: 600px) {
    .task-card { padding: 15px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dots"><span>●</span><span>● ●</span><span>● ● ●</span><span>● ● ● ●</span></div>
    <div class="logo-text">ΤΕΤΡΑΚΤΥΣ<small>ШКОЛА МАТЕМАТИКИ</small></div>
  </div>
  <div class="header-info">
    <div class="chip" id="dateDisplay">📅 --.--.----</div>
    <div class="chip timer" id="timerDisplay" title="Клик — пауза/старт">⏱ 00:00</div>
    <div class="chip ok" id="scoreDisplay">✅ 0 / 5</div>
  </div>
</header>

<div class="main-container">
  <div class="name-block">
    <label>👤 Имя ученика:</label>
    <input type="text" id="studentName" placeholder="Введи имя и фамилию" autocomplete="off">
  </div>

  <div id="content"></div>
</div>

<div class="bottom-bar">
  <button class="btn btn-primary" onclick="checkAll()" id="btnCheck">✅ Проверить</button>
  <button class="btn btn-gold" onclick="startNew()">🔄 Сменить</button>
  <button class="btn btn-max" onclick="sendToMax()">💬 В Макс</button>
</div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-box">
    <div class="summary-title">📊 Результат</div>
    <div class="summary-stats">
      <div class="summary-stat"><span class="num ok" id="statOk">0</span><span class="lbl">✅ верно</span></div>
      <div class="summary-stat"><span class="num err" id="statErr">0</span><span class="lbl">❌ неверно</span></div>
      <div class="summary-stat"><span class="num pct" id="statPercent">0%</span><span class="lbl">📊 процент</span></div>
    </div>
    <div class="summary-line" id="summaryLine">—</div>
    <button class="btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="document.getElementById('summaryOverlay').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
const SETS = [
  { L: 3.2, W: 2.5, H: 1.9, door_w: 60, door_h: 170, pech: [{type:'дровяная', min:7, max:11, mass:42, cost:17000}, {type:'дровяная', min:9, max:17, mass:46, cost:18500}, {type:'электрическая', min:8, max:16.5, mass:18, cost:14000}], cable: 6200, task1_type: 'стоимость', task3_type: 'дров+доставка', task3_delivery: 1200, task4: { type: 'скидка_на_номер_2_с_доставкой', skidka_tovar: 10, skidka_dost: 25, delivery: 1000 }, task5_w: 40, task5_h: 48 },
  { L: 3.4, W: 2, H: 2.1, door_w: 62, door_h: 180, pech: [{type:'дровяная', min:8, max:12, mass:39, cost:22000}, {type:'дровяная', min:10, max:19.5, mass:41, cost:28000}, {type:'электрическая', min:9, max:17, mass:17, cost:30000}], cable: 6800, task1_type: 'масса', task3_type: 'эл+установка+доставка', task3_delivery: 1000, task4: { type: 'скидка_на_номер_1_с_доставкой', skidka_tovar: 15, skidka_dost: 20, delivery: 800 }, task5_w: 66, task5_h: 44 },
  { L: 3.5, W: 2, H: 2.3, door_w: 64, door_h: 190, pech: [{type:'дровяная', min:8, max:15, mass:58, cost:16500}, {type:'дровяная', min:7, max:16.5, mass:70, cost:21000}, {type:'электрическая', min:9, max:18, mass:33, cost:18000}], cable: 6400, task1_type: 'стоимость', task3_type: 'эл+установка+доставка', task3_delivery: 800, task4: { type: 'скидка_на_номер_1_с_доставкой', skidka_tovar: 5, skidka_dost: 25, delivery: 1000 }, task5_w: 42, task5_h: 72 },
  { L: 3, W: 2.5, H: 2.2, door_w: 64, door_h: 200, pech: [{type:'дровяная', min:7, max:14, mass:43, cost:17000}, {type:'дровяная', min:9, max:17, mass:61, cost:24000}, {type:'электрическая', min:8, max:18.5, mass:28, cost:18500}], cable: 5900, task1_type: 'объём', task3_type: 'разница дров vs эл+установка', task4: { type: 'в_прошлом_году_ном_2', skidka: 40 }, task5_w: 72, task5_h: 48 },
  { L: 3.1, W: 2.2, H: 2, door_w: 60, door_h: 180, pech: [{type:'дровяная', min:8, max:13, mass:42, cost:19000}, {type:'дровяная', min:11, max:15, mass:54, cost:27000}, {type:'электрическая', min:7, max:17.5, mass:21, cost:22500}], cable: 5700, task1_type: 'объём', task3_type: 'разница дров vs эл+установка', task4: { type: 'в_прошлом_году_ном_3', skidka: 25 }, task5_w: 48, task5_h: 45 },
  { L: 3.3, W: 2, H: 2.2, door_w: 60, door_h: 200, pech: [{type:'дровяная', min:9, max:14.5, mass:51, cost:16000}, {type:'дровяная', min:15, max:16, mass:74, cost:22500}, {type:'электрическая', min:10, max:19, mass:22, cost:20000}], cable: 5500, task1_type: 'стоимость', task3_type: 'разница дров vs эл+установка', task4: { type: 'скидка_на_номер_3_с_доставкой', skidka_tovar: 5, skidka_dost: 30, delivery: 1000 }, task5_w: 54, task5_h: 36 },
  { L: 3.2, W: 2.4, H: 2, door_w: 62, door_h: 180, pech: [{type:'дровяная', min:7, max:12.5, mass:49, cost:20500}, {type:'дровяная', min:10, max:16, mass:66, cost:26000}, {type:'электрическая', min:8, max:17.5, mass:19, cost:22000}], cable: 5400, task1_type: 'стоимость', task3_type: 'разница дров vs эл+установка', task4: { type: 'скидка_на_эл', skidka: 15, target: 2 }, task5_w: 64, task5_h: 60 },
  { L: 3.3, W: 2, H: 2.2, door_w: 60, door_h: 200, pech: [{type:'дровяная', min:9, max:14.5, mass:51, cost:16000}, {type:'дровяная', min:15, max:16, mass:74, cost:22500}, {type:'электрическая', min:10, max:19, mass:22, cost:20000}], cable: 5500, task1_type: 'объём', task3_type: 'разница дров vs эл+установка', task4: { type: 'скидка_на_дров_mass74', skidka: 10 }, task5_w: 72, task5_h: 27 },
  { L: 3.6, W: 2.3, H: 2.1, door_w: 60, door_h: 190, pech: [{type:'дровяная', min:9, max:13, mass:38, cost:19000}, {type:'дровяная', min:11, max:19, mass:52, cost:23500}, {type:'электрическая', min:8, max:16, mass:20, cost:30000}], cable: 6000, task1_type: 'стоимость', task3_type: 'дров+доставка', task3_delivery: 1300, task4: { type: 'скидка_на_номер_2_с_доставкой', skidka_tovar: 5, skidka_dost: 25, delivery: 1000 }, task5_w: 60, task5_h: 40 },
  { L: 3.4, W: 2.4, H: 2.2, door_w: 64, door_h: 190, pech: [{type:'дровяная', min:8, max:14, mass:45, cost:20000}, {type:'дровяная', min:12, max:22, mass:60, cost:26500}, {type:'электрическая', min:9, max:17, mass:25, cost:21000}], cable: 5800, task1_type: 'масса', task3_type: 'эл+установка+доставка', task3_delivery: 1500, task4: { type: 'скидка_на_номер_2_с_доставкой', skidka_tovar: 10, skidka_dost: 30, delivery: 1000 }, task5_w: 72, task5_h: 48 }
];

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function fmtNum(n){ if (typeof n !== 'number') return n; if (Number.isInteger(n)) return String(n); return n.toFixed(2).replace(/\.?0+$/, '').replace('.', ','); }
function volume(s){ return s.L * s.W * s.H; }
function areaFloor(s){ return s.L * s.W; }
function areaWalls(s){ const P = 2 * (s.L + s.W); return P * s.H - (s.door_w/100) * (s.door_h/100); }
function getWoodPech(s){ const V = volume(s); return s.pech.find(p => p.type === 'дровяная' && p.min <= V && V <= p.max); }
function getElPech(s){ return s.pech.find(p => p.type === 'электрическая'); }

function task1Correct(s){
  let values = s.task1_type === 'стоимость' ? [s.pech[0].cost, s.pech[1].cost, s.pech[2].cost] :
               s.task1_type === 'масса' ? [s.pech[0].mass, s.pech[1].mass, s.pech[2].mass] :
               [s.pech[0].max, s.pech[1].max, s.pech[2].max];
  return values.map((v, i) => ({ v, num: i + 1 })).sort((a, b) => b.v - a.v).map(p => p.num).join('');
}
function task1DisplayValues(s){
  let values = s.task1_type === 'стоимость' ? [s.pech[0].cost, s.pech[1].cost, s.pech[2].cost] :
               s.task1_type === 'масса' ? [s.pech[0].mass, s.pech[1].mass, s.pech[2].mass] :
               [s.pech[0].max, s.pech[1].max, s.pech[2].max];
  return values.slice().sort((a, b) => b - a);
}
function task2Correct(s, type){ return type === 'объём' ? volume(s) : type === 'площадь пола' ? areaFloor(s) : type === 'площадь потолка' ? areaFloor(s) : areaWalls(s); }
function task3Correct(s){
  const wood = getWoodPech(s), el = getElPech(s); if (!wood || !el) return null;
  if (s.task3_type === 'дров+доставка') return wood.cost + s.task3_delivery;
  if (s.task3_type === 'эл+установка+доставка') return el.cost + s.cable + s.task3_delivery;
  if (s.task3_type === 'разница дров vs эл') return el.cost - wood.cost;
  if (s.task3_type === 'разница дров vs эл+установка') return (el.cost + s.cable) - wood.cost;
  return null;
}
function task4Correct(s){
  const t = s.task4; if (!t) return null;
  if (t.type === 'скидка_на_номер_2_с_доставкой') return s.pech[1].cost * (1 - t.skidka_tovar / 100) + t.delivery * (1 - t.skidka_dost / 100);
  if (t.type === 'скидка_на_номер_1_с_доставкой') return s.pech[0].cost * (1 - t.skidka_tovar / 100) + t.delivery * (1 - t.skidka_dost / 100);
  if (t.type === 'скидка_на_номер_3_с_доставкой') return s.pech[2].cost * (1 - t.skidka_tovar / 100) + t.delivery * (1 - t.skidka_dost / 100);
  if (t.type === 'в_прошлом_году_ном_2') return s.pech[1].cost / (1 - t.skidka / 100);
  if (t.type === 'в_прошлом_году_ном_3') return s.pech[2].cost / (1 - t.skidka / 100);
  if (t.type === 'скидка_на_эл') return getElPech(s).cost * (1 - t.skidka / 100);
  if (t.type === 'скидка_на_дров_mass74') { const p = s.pech.find(p => p.mass === 74); return p.cost * (1 - t.skidka / 100); }
  return null;
}
function task4Text(s){
  const t = s.task4; if (!t) return '';
  if (t.type === 'скидка_на_номер_2_с_доставкой') return `Доставка любой печи из магазина до участка стоит ${t.delivery} рублей. При покупке печи стоимостью больше ${(t.skidka_tovar >= 10 ? '18000' : '15000')} рублей магазин делает скидку ${t.skidka_tovar}% на товар и ${t.skidka_dost}% на доставку. Сколько рублей будет стоить покупка печи номер 2 с доставкой на этих условиях?`;
  if (t.type === 'скидка_на_номер_1_с_доставкой') return `Доставка любой печи из магазина до участка стоит ${t.delivery} рублей. При покупке печи стоимостью больше ${(t.skidka_tovar >= 10 ? '20000' : '15000')} рублей магазин делает скидку ${t.skidka_tovar}% на товар и ${t.skidka_dost}% на доставку. Сколько рублей будет стоить покупка печи номер 1 с доставкой на этих условиях?`;
  if (t.type === 'скидка_на_номер_3_с_доставкой') return `Доставка любой печи из магазина до участка стоит ${t.delivery} рублей. При покупке печи стоимостью больше ${(t.skidka_tovar >= 10 ? '18000' : '15000')} рублей магазин делает скидку ${t.skidka_tovar}% на товар и ${t.skidka_dost}% на доставку. Сколько рублей будет стоить покупка печи номер 3 с доставкой на этих условиях?`;
  if (t.type === 'в_прошлом_году_ном_2') return `В прошлом году печи, указанные в таблице, стоили дороже. На них были сделаны скидки: на печь номер 1 скидка составила 15%, на печь номер 2 – ${t.skidka}%, на печь номер 3 – 25%. Сколько рублей стоила печь номер 2 в прошлом году?`;
  if (t.type === 'в_прошлом_году_ном_3') return `В прошлом году печи, указанные в таблице, стоили дороже. На них были сделаны скидки: на печь номер 1 скидка составила 10%, на печь номер 2 – 35%, на печь номер 3 – ${t.skidka}%. Сколько рублей стоила печь номер 3 в прошлом году?`;
  if (t.type === 'скидка_на_эл') return `На электрическую печь сделали скидку ${t.skidka}%. Сколько рублей стала стоить печь?`;
  if (t.type === 'скидка_на_дров_mass74') return `На дровяную печь, масса которой 74 кг, сделали скидку ${t.skidka}%. Сколько рублей стала стоить печь?`;
  return '';
}
function task5Correct(s){ return Math.sqrt((s.task5_w/2) * (s.task5_w/2) + s.task5_h * s.task5_h); }

function renderArc(w, h){
  const scale = 160 / w, wSvg = w * scale, hSvg = h * scale, RSvg = Math.sqrt((w/2)*(w/2) + h*h) * scale;
  const bodyH = 220, bodyW = wSvg, x0 = 100, y0 = 50, cx = x0 + bodyW / 2, cyBase = y0 + bodyH, ySide = cyBase - hSvg;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" style="background:#f7fcfa;border-radius:10px;"><rect x="0" y="0" width="500" height="350" fill="#f7fcfa"/><rect x="${x0}" y="${y0}" width="${bodyW}" height="${bodyH}" fill="#d8d8d8" stroke="#000" stroke-width="1.5"/><rect x="${x0 + bodyW*0.2}" y="${y0 + 20}" width="${bodyW*0.6}" height="30" rx="5" fill="#e8e8e8" stroke="#888" stroke-width="1"/><path d="M ${x0},${ySide} A ${RSvg},${RSvg} 0 0 1 ${x0 + bodyW},${ySide}" fill="none" stroke="#000" stroke-width="2"/><rect x="${x0 + bodyW*0.25}" y="${cyBase - 70}" width="${bodyW*0.5}" height="70" fill="#e8e8e8" stroke="#000" stroke-width="1.5"/><line x1="${cx}" y1="${cyBase}" x2="${x0}" y2="${ySide}" stroke="#1a3a6a" stroke-width="2"/><text x="${x0 + bodyW*0.3}" y="${cyBase - 20}" font-family="Georgia,serif" font-size="18" font-style="italic" font-weight="700" fill="#1a3a6a">R</text><line x1="${x0 - 20}" y1="${ySide}" x2="${x0 - 20}" y2="${cyBase}" stroke="#2d2b4e" stroke-width="1"/><polygon points="${x0-20},${ySide} ${x0-24},${ySide+8} ${x0-16},${ySide+8}" fill="#2d2b4e"/><polygon points="${x0-20},${cyBase} ${x0-24},${cyBase-8} ${x0-16},${cyBase-8}" fill="#2d2b4e"/><line x1="${x0-25}" y1="${ySide}" x2="${x0}" y2="${ySide}" stroke="#2d2b4e" stroke-width="0.8" stroke-dasharray="3,2"/><line x1="${x0-25}" y1="${cyBase}" x2="${x0}" y2="${cyBase}" stroke="#2d2b4e" stroke-width="0.8" stroke-dasharray="3,2"/><text x="${x0-30}" y="${(ySide+cyBase)/2}" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#2d2b4e" text-anchor="end">${h}</text><line x1="${x0}" y1="${cyBase+20}" x2="${x0+bodyW}" y2="${cyBase+20}" stroke="#2d2b4e" stroke-width="1"/><polygon points="${x0},${cyBase+20} ${x0+8},${cyBase+16} ${x0+8},${cyBase+24}" fill="#2d2b4e"/><polygon points="${x0+bodyW},${cyBase+20} ${x0+bodyW-8},${cyBase+16} ${x0+bodyW-8},${cyBase+24}" fill="#2d2b4e"/><line x1="${x0}" y1="${cyBase}" x2="${x0}" y2="${cyBase+25}" stroke="#2d2b4e" stroke-width="0.8" stroke-dasharray="3,2"/><line x1="${x0+bodyW}" y1="${cyBase}" x2="${x0+bodyW}" y2="${cyBase+25}" stroke="#2d2b4e" stroke-width="0.8" stroke-dasharray="3,2"/><text x="${cx}" y="${cyBase+40}" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#2d2b4e" text-anchor="middle">${w}</text></svg>`;
}

let lastIdx = -1, state = null, checked = false, task2_type = 'объём';

function generateTask(){
  let idx; do { idx = randInt(0, SETS.length - 1); } while (idx === lastIdx);
  lastIdx = idx;
  const types = ['объём', 'площадь пола', 'площадь потолка', 'площадь стен'];
  task2_type = types[randInt(0, types.length - 1)];
  return JSON.parse(JSON.stringify(SETS[idx]));
}

  let task2_text = task2_type === 'объём' ? 'Найдите объём парного отделения строящейся бани. Ответ дайте в кубических метрах.' : task2_type === 'площадь пола' ? 'Найдите площадь пола парного отделения строящейся бани. Ответ дайте в квадратных метрах.' : task2_type === 'площадь потолка' ? 'Найдите площадь потолка парного отделения строящейся бани. Ответ дайте в квадратных метрах.' : 'Найдите суммарную площадь стен парного отделения строящейся бани (без площади двери). Ответ дайте в квадратных метрах.';

  let task3_text = '';
  if (s.task3_type === 'дров+доставка') task3_text = `Во сколько рублей обойдётся покупка дровяной печи, подходящей по объёму парного отделения, с доставкой, если доставка печи до дачного участка будет стоить <b>${s.task3_delivery} рублей</b>?`;
  else if (s.task3_type === 'эл+установка+доставка') task3_text = `Во сколько рублей обойдётся покупка электрической печи с установкой и доставкой, если доставка печи до дачного участка будет стоить <b>${s.task3_delivery} рублей</b>?`;
  else if (s.task3_type === 'разница дров vs эл') task3_text = `На сколько рублей покупка дровяной печи, подходящей по объёму парного отделения, обойдётся <b>дешевле</b> электрической без учёта установки?`;
  else task3_text = `На сколько рублей покупка дровяной печи, подходящей по объёму парного отделения, обойдётся <b>дешевле</b> электрической с учётом установки?`;

  let html = `
    <div class="condition-block">
      Хозяин дачного участка строит баню с парным отделением. Парное отделение имеет размеры: длина <b>${fmtNum(s.L)} м</b>, ширина <b>${fmtNum(s.W)} м</b>, высота <b>${fmtNum(s.H)} м</b>. Окон в парном отделении нет, для доступа внутрь планируется дверь шириной <b>${s.door_w} см</b>, высота дверного проёма <b>${s.door_h} см</b>. Для прогрева парного отделения можно использовать электрическую или дровяную печь. В таблице представлены характеристики трёх печей.
      <div class="table-scroll">${pechTable}</div>
      Для установки дровяной печи дополнительных затрат не потребуется. Установка электрической печи потребует подведения специального кабеля, что обойдётся в <b>${s.cable.toLocaleString('ru-RU')} руб.</b>
    </div>
    <div class="task-card" id="task-1">
      <div class="task-header"><div class="task-num">1</div><div class="task-title">Соответствие</div><div class="task-mark" id="mark-1"></div></div>
      <div class="task-question">Установите соответствие между ${s.task1_type === 'масса' ? 'массами' : s.task1_type === 'стоимость' ? 'стоимостями' : 'максимальными объёмами'} и номерами печей. Заполните таблицу, в бланк ответов перенесите последовательность трёх цифр <b>без пробелов, запятых</b>.</div>
      <table class="table-task"><thead><tr>${t1head}</tr></thead><tbody><tr>${t1body}</tr></tbody></table>
      <div class="answer-row" style="margin-top:10px;"><input type="text" id="ans-1" placeholder="3 цифры" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-1"></div>
    </div>
    <div class="task-card" id="task-2">
      <div class="task-header"><div class="task-num">2</div><div class="task-title">Расчёт</div><div class="task-mark" id="mark-2"></div></div>
      <div class="task-question">${task2_text}</div>
      <div class="answer-row"><input type="text" id="ans-2" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-2"></div>
    </div>
    <div class="task-card" id="task-3">
      <div class="task-header"><div class="task-num">3</div><div class="task-title">Покупка</div><div class="task-mark" id="mark-3"></div></div>
      <div class="task-question">${task3_text}</div>
      <div class="answer-row"><input type="text" id="ans-3" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-3"></div>

      <div class="task-question">${task4Text(s)}</div>
      <div class="answer-row"><input type="text" id="ans-4" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-4"></div>

    <div class="task-card" id="task-5">
      <div class="task-header"><div class="task-num">5</div><div class="task-title">Радиус арки</div><div class="task-mark" id="mark-5"></div></div>
      <div class="task-question">Хозяин выбрал дровяную печь. Чертёж передней панели печи показан на рисунке. Печь снабжена кожухом вокруг дверцы топки. Верхняя часть кожуха выполнена в виде арки, приваренной к передней стенке печки по дуге окружности с центром в середине нижней части кожуха. Для установки печки хозяину понадобилось узнать радиус закругления арки R. Размеры кожуха в сантиметрах показаны на рисунке. Найдите радиус закругления арки в сантиметрах.</div>
      <div class="graph-wrap">${renderArc(s.task5_w, s.task5_h)}</div>
      <div class="answer-row"><input type="text" id="ans-5" placeholder="введи число" autocomplete="off"></div>
      <div class="correct-answer-note" id="note-5"></div>
    </div>
  `;
  document.getElementById('content').innerHTML = html;
}

function normAnswer(s){ return String(s||'').trim().replace(/\s+/g,'').replace(',','.').replace(/[°%кмминлГБгбрубсм]+$/gi,''); }
function checkNumeric(userAns, correctAns){ const u = normAnswer(userAns); const c = normAnswer(correctAns); if(!u) return false; if(u === c) return true; const un = parseFloat(u), cn = parseFloat(c); return (!isNaN(un) && !isNaN(cn) && Math.abs(un - cn) < 0.02); }

function checkAll(){
  const name = document.getElementById('studentName').value.trim();
  if(!name){ alert('Введи имя ученика!'); return; }
  const s = state;
  let okCount = 0, errCount = 0;
  
  // Задание 1
  const t1Correct = task1Correct(s), t1values = task1DisplayValues(s);
  let allFields1 = true;
  t1values.forEach((v, j) => {
    const inp = document.getElementById('m-1-'+v); if (!inp) return;
    inp.disabled = true; if(inp.value.trim() === t1Correct[j]) inp.classList.add('correct'); else { inp.classList.add('wrong'); allFields1 = false; }
  });
  const ans1Inp = document.getElementById('ans-1'), ans1 = ans1Inp.value.trim();
  const ans1Ok = (ans1 === t1Correct); ans1Inp.disabled = true; ans1Inp.classList.add(ans1Ok ? 'correct' : 'wrong');
  const task1Ok = allFields1 && ans1Ok;
  document.getElementById('mark-1').textContent = task1Ok ? '✅' : '❌';
  document.getElementById('task-1').classList.add(task1Ok ? 'solved-ok' : 'solved-bad');
  if(!task1Ok){ document.getElementById('note-1').innerHTML = 'Правильный ответ: <b>' + t1Correct + '</b>'; document.getElementById('note-1').classList.add('show'); }
  if(task1Ok) okCount++; else errCount++;

  // 2-5
  const answers = { 2: task2Correct(s, task2_type), 3: task3Correct(s), 4: task4Correct(s), 5: task5Correct(s) };
  [2,3,4,5].forEach(n => {
    const inp = document.getElementById('ans-'+n), val = inp.value.trim();
    const isOk = checkNumeric(val, answers[n]);
    inp.classList.add(isOk ? 'correct' : 'wrong'); inp.disabled = true;
    document.getElementById('mark-'+n).textContent = isOk ? '✅' : '❌';
    document.getElementById('task-'+n).classList.add(isOk ? 'solved-ok' : 'solved-bad');
    if(!isOk){ document.getElementById('note-'+n).innerHTML = 'Правильный ответ: <b>' + fmtNum(answers[n]) + '</b>'; document.getElementById('note-'+n).classList.add('show'); }
    if(isOk) okCount++; else errCount++;
  });

  const percent = Math.round(okCount / 5 * 100);
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statErr').textContent = errCount;
  document.getElementById('statPercent').textContent = percent + '%';
  document.getElementById('summaryLine').textContent = percent >= 80 ? '🌟 Отлично!' : percent >= 50 ? '👍 Хорошо, но можно лучше' : '📚 Стоит повторить';
  document.getElementById('summaryOverlay').classList.add('show');
  document.getElementById('scoreDisplay').textContent = `✅ ${okCount} / 5`;
  const btn = document.getElementById('btnCheck');
  btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Проверено';
}

function sendToMax(){
  const name = document.getElementById('studentName').value.trim() || 'Без имени';
  let text = `🔥 ТРЕНАЖЕР · Печка\nУченик: ${name}\nДата: ${new Date().toLocaleString('ru-RU')}\n--------------------------------\n\n`;
  let okCount = 0;
  const s = state;
  const answers = { 1: task1Correct(s), 2: task2Correct(s, task2_type), 3: task3Correct(s), 4: task4Correct(s), 5: task5Correct(s) };

  for(let i = 1; i <= 5; i++){
    let userAns = i === 1 ? document.getElementById('ans-1').value.trim() : document.getElementById('ans-'+i).value.trim();
    let isOk = false;
    if(i === 1) isOk = (userAns === answers[1]);
    else isOk = checkNumeric(userAns, answers[i]);

    if(userAns !== '') {
      if(isOk) { okCount++; text += `✅ Задача ${i}. Ответ: ${userAns} (верно)\n`; }
      else { text += `❌ Задача ${i}. Ответ: ${userAns} (правильный: ${i === 1 ? answers[1] : fmtNum(answers[i])})\n`; }
    } else {
      text += `— Задача ${i}. (не решено)\n`;
    }
  }
  text += `\n✅ Итог: ${okCount} из 5 верно`;
  navigator.clipboard.writeText(text).then(() => {
    alert('Отчет скопирован! Открываем чат Макс...');
    window.open('https://max.ru/u/f9LHodD0cOLjga5OFLMq8VyyMVxwRMnAtUTfKxnMebvnxW-IcLDiq4PIfes', '_blank');
  }).catch(err => alert('Ошибка копирования: ' + err));
}

function startNew(){
  checked = false;
  const btn = document.getElementById('btnCheck');
  btn.disabled = false; btn.textContent = '✅ Проверить'; btn.style.opacity = '1'; btn.style.background = '';
  document.getElementById('summaryOverlay').classList.remove('show');
  state = generateTask(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

let timerInterval, timerSeconds = 0, isTimerRunning = true;
window.onload = () => {
  const d = new Date();
  document.getElementById('dateDisplay').textContent = '📅 ' + d.toLocaleDateString('ru-RU');
  timerInterval = setInterval(() => {
    if (isTimerRunning) {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `⏱ ${m}:${s}`;
    }
  }, 1000);
  document.getElementById('timerDisplay').onclick = function() {
    isTimerRunning = !isTimerRunning;
    this.style.opacity = isTimerRunning ? 1 : 0.5;
  };
  const savedName = localStorage.getItem('dz_pechka_name');
  if(savedName) document.getElementById('studentName').value = savedName;
  document.getElementById('studentName').addEventListener('input', (e) => {
    localStorage.setItem('dz_pechka_name', e.target.value);
  });
  startNew();
};
