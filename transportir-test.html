<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Транспортир · тест шкалы · ΤΕΤΡΑΚΤΥΣ</title>
<style>
    :root {
        --teal: #1abc9c;
        --teal-dark: #16a085;
        --teal-deep: #0e7c66;
        --mint: #7fffd4;
        --gold: #f4d35e;
        --coral: #ff6b6b;
        --text: #e8f8f5;
        --text-soft: #b8d8d0;
        --ok: #2ecc71;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: Georgia, 'Times New Roman', serif;
        background:
            radial-gradient(ellipse at 15% 10%, rgba(26,188,156,0.22), transparent 55%),
            radial-gradient(ellipse at 85% 90%, rgba(127,255,212,0.15), transparent 55%),
            radial-gradient(ellipse at 50% 50%, rgba(244,211,94,0.06), transparent 70%),
            linear-gradient(160deg, #0a2a33 0%, #0d3b47 50%, #134e5e 100%);
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
        padding: 20px 12px;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(10, 42, 51, 0.72);
        border: 2px solid var(--teal-dark);
        border-radius: 24px;
        padding: 22px 26px 18px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    }
    h1 {
        text-align: center;
        font-size: 26px;
        color: var(--text);
        margin-bottom: 6px;
    }
    h1 span { color: var(--gold); }
    .sub {
        text-align: center;
        color: var(--text-soft);
        font-size: 14px;
        font-style: italic;
        margin-bottom: 14px;
    }
    .canvas-wrap {
        background: #f7fcfa;
        border-radius: 14px;
        border: 2px solid var(--teal-dark);
        padding: 8px;
        text-align: center;
    }
    canvas {
        display: block;
        width: 100%;
        max-width: 760px;
        height: auto;
        margin: 0 auto;
        background: #f7fcfa;
        border-radius: 10px;
        touch-action: none;
        cursor: crosshair;
    }
    .info {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 14px;
        padding: 10px 16px;
        background: rgba(10,42,51,0.6);
        border-radius: 12px;
        border: 1.5px solid rgba(26,188,156,0.4);
        font-family: 'Courier New', monospace;
    }
    .label {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
    }
    .label .val { font-size: 20px; color: var(--mint); }
    .label .type { color: var(--gold); font-size: 16px; }
    .hint {
        text-align: center;
        font-size: 13px;
        color: var(--text-soft);
        margin-top: 12px;
        padding: 8px;
        background: rgba(10,42,51,0.5);
        border-radius: 8px;
        border: 1px solid rgba(26,188,156,0.25);
        font-style: italic;
    }
    .hint span { color: var(--mint); font-weight: 700; font-style: normal; }
    .check {
        text-align: center;
        margin-top: 14px;
        font-size: 13px;
        color: var(--text-soft);
        line-height: 1.8;
    }
    .check b { color: var(--gold); }
</style>
</head>
<body>
<div class="container">
    <h1>📐 Транспортир <span>· тест шкалы</span></h1>
    <div class="sub">0° — справа (у луча OA) · 180° — слева</div>

    <div class="canvas-wrap">
        <canvas id="canvas" width="760" height="420"></canvas>
    </div>

    <div class="info">
        <span class="label">📐 ∠AOB = <span class="val" id="angleVal">60</span>°</span>
        <span class="label">🔷 Тип: <span class="type" id="typeVal">острый</span></span>
    </div>

    <div class="hint">
        💡 Тяни <span>жёлтую точку B</span>: влево — угол растёт, вправо — уменьшается, вверх — 90°
    </div>

    <div class="check">
        Проверь шкалу:<br>
        <b>0°</b> должен быть справа (у красного луча OA)<br>
        <b>90°</b> — сверху<br>
        <b>180°</b> — слева<br>
        Цифры растут <b>справа налево</b>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Вершина O — внизу, сдвинута вправо чтобы весь транспортир влез
const O = { x: 340, y: 380 };
const R = 300;
const RULER_R = 320;

let angleDeg = 60;
let dragging = false;

// ============================================================
//  ТИП УГЛА
// ============================================================
function angleType(a) {
    if (a < 90) return 'острый';
    if (a === 90) return 'прямой';
    if (a < 180) return 'тупой';
    return 'развёрнутый';
}

// ============================================================
//  ОТРИСОВКА
// ============================================================
function draw() {
    const w = canvas.width, h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#f7fcfa';
    ctx.fillRect(0, 0, w, h);

    // Сетка
    ctx.strokeStyle = 'rgba(14,124,102,0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y <= h; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // ============================================================
    //  ШКАЛА ТРАНСПОРТИРА
    //  ВАЖНО: 0° — справа (там где луч OA)
    //         180° — слева
    //  В canvas угол отсчитывается от положительной оси X против часовой
    //  Для нас: точка под углом a (a от 0 до 180, где 0 — вправо, 180 — влево)
    //  Координаты: x = O.x + R * cos(a_rad); y = O.y - R * sin(a_rad)
    // ============================================================
    const D2R = Math.PI / 180;

    // Полукруг шкалы
    ctx.beginPath();
    ctx.arc(O.x, O.y, RULER_R, Math.PI, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(14,124,102,0.30)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Деления каждые 5°
    for (let a = 0; a <= 180; a += 5) {
        const rad = a * D2R;           // ← теперь без минуса и без π
        // a = 0 → rad = 0 → x = O.x + R (вправо) ✅
        // a = 90 → rad = π/2 → x = O.x, y = O.y - R (вверх) ✅
        // a = 180 → rad = π → x = O.x - R (влево) ✅
        const x1 = O.x + RULER_R * Math.cos(rad);
        const y1 = O.y - RULER_R * Math.sin(rad);

        const big = (a % 30 === 0);
        const medium = (a % 10 === 0);
        const len = big ? 16 : (medium ? 10 : 6);
        const x2 = O.x + (RULER_R - len) * Math.cos(rad);
        const y2 = O.y - (RULER_R - len) * Math.sin(rad);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = big ? '#0e7c66' : 'rgba(14,124,102,0.55)';
        ctx.lineWidth = big ? 2 : (medium ? 1.3 : 1);
        ctx.stroke();

        // Цифры
        if (big) {
            const tx = O.x + (RULER_R + 18) * Math.cos(rad);
            const ty = O.y - (RULER_R + 18) * Math.sin(rad);
            ctx.fillStyle = '#0e7c66';
            ctx.font = 'bold 13px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(a + '°', tx, ty);
        }
    }

    // ============================================================
    //  ЛУЧ OA — 0°, вправо
    // ============================================================
    const ax = O.x + R * Math.cos(0);
    const ay = O.y - R * Math.sin(0);

    ctx.beginPath();
    ctx.moveTo(O.x, O.y);
    ctx.lineTo(ax, ay);
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();

    // ============================================================
    //  ЛУЧ OB — под углом angleDeg
    // ============================================================
    const bRad = angleDeg * D2R;
    const bx = O.x + R * Math.cos(bRad);
    const by = O.y - R * Math.sin(bRad);

    ctx.beginPath();
    ctx.moveTo(O.x, O.y);
    ctx.lineTo(bx, by);
    ctx.strokeStyle = '#1abc9c';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();

    // ============================================================
    //  ДУГА УГЛА — от OA (0°) до OB (angleDeg)
    // ============================================================
    ctx.beginPath();
    // В canvas arc() по умолчанию рисует ПО ЧАСОВОЙ от startAngle до endAngle,
    // но т.к. ось Y вниз — визуально это выглядит как ПРОТИВ часовой.
    // startAngle = 0 (луч OA), endAngle = -bRad (потому что в canvas
    // положительный угол — вниз, а нам надо вверх)
    ctx.arc(O.x, O.y, 90, -bRad, 0, false);
    ctx.strokeStyle = '#f4d35e';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Стрелочка на конце дуги
    const arcEndX = O.x + 90 * Math.cos(bRad);
    const arcEndY = O.y - 90 * Math.sin(bRad);
    ctx.beginPath();
    ctx.arc(arcEndX, arcEndY, 4, 0, 2 * Math.PI);
    ctx.fillStyle = '#f4d35e';
    ctx.fill();

    // ============================================================
    //  ВЕРШИНА O
    // ============================================================
    ctx.beginPath();
    ctx.arc(O.x, O.y, 10, 0, 2 * Math.PI);
    ctx.fillStyle = '#f4d35e';
    ctx.fill();
    ctx.strokeStyle = '#0e7c66';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = '#0e7c66';
    ctx.font = 'bold 16px Georgia';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('O', O.x, O.y + 14);

    // Точка A
    ctx.beginPath();
    ctx.arc(ax, ay, 8, 0, 2 * Math.PI);
    ctx.fillStyle = '#ff6b6b';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 16px Georgia';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('A', ax + 14, ay);

    // Точка B — жёлтая, перетаскиваемая
    ctx.beginPath();
    ctx.arc(bx, by, 14, 0, 2 * Math.PI);
    ctx.fillStyle = '#f4d35e';
    ctx.fill();
    ctx.strokeStyle = '#0e7c66';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(bx - 4, by - 4, 4, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
    ctx.fillStyle = '#0e7c66';
    ctx.font = 'bold 15px Georgia';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('B', bx, by + 1);

    // Значение угла
    const midRad = (angleDeg / 2) * D2R;
    const labelX = O.x + 130 * Math.cos(midRad);
    const labelY = O.y - 130 * Math.sin(midRad);
    ctx.fillStyle = '#0e7c66';
    ctx.font = 'bold 22px Georgia';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(angleDeg + '°', labelX, labelY);

    // Обновляем надписи
    document.getElementById('angleVal').textContent = angleDeg;
    document.getElementById('typeVal').textContent = angleType(angleDeg);
}

// ============================================================
//  ПЕРЕТАСКИВАНИЕ
// ============================================================
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    let cx, cy;
    if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
}

function currentB() {
    const bRad = angleDeg * Math.PI / 180;
    return {
        x: O.x + R * Math.cos(bRad),
        y: O.y - R * Math.sin(bRad)
    };
}

function onDown(e) {
    e.preventDefault();
    const pos = getPos(e);
    const B = currentB();
    if (Math.sqrt((pos.x - B.x) ** 2 + (pos.y - B.y) ** 2) < 45) {
        dragging = true;
        canvas.style.cursor = 'grabbing';
    }
}

function onMove(e) {
    const pos = getPos(e);

    if (dragging) {
        // Та же правильная формула: движение совпадает с рукой
        const dx = pos.x - O.x;
        const dy = O.y - pos.y;
        let a = Math.atan2(dy, dx) * 180 / Math.PI;
        if (a < 0) a = 0;
        if (a > 180) a = 180;
        angleDeg = Math.round(a);
        draw();
        e.preventDefault && e.preventDefault();
        return;
    }

    const B = currentB();
    if (Math.sqrt((pos.x - B.x) ** 2 + (pos.y - B.y) ** 2) < 45) {
        canvas.style.cursor = 'grab';
    } else {
        canvas.style.cursor = 'crosshair';
    }
}

function onUp() {
    dragging = false;
    canvas.style.cursor = 'crosshair';
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });

draw();
</script>
</body>
</html>
