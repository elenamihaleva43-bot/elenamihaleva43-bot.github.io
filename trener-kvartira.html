<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренажер · Квартира · ΤΕΤΡΑΚΤΥΣ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #113c38; --panel: rgba(22, 83, 77, 0.6); --bg2: #0b2b27;
    --line: rgba(47, 212, 181, 0.3); --turq: #2fd4b5; --mint: #7fe8c8;
    --gold: #e8c45a; --text: #e0f2ec; --coral: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, rgba(47, 212, 181, 0.15) 0%, transparent 40%),
                      radial-gradient(circle at 85% 90%, rgba(47, 212, 181, 0.1) 0%, transparent 40%);
    background-attachment: fixed; color: var(--text);
    font-family: Georgia, serif; padding: 20px; margin: 0;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    overflow-x: hidden;
  }
  
  header {
    position: sticky; top: 0; z-index: 50; width: 100%; max-width: 1100px;
    background: rgba(17, 60, 56, 0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 15px 20px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 0 0 18px 18px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dots { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--gold); line-height: 1; }
  .logo-text { font-family: 'Times New Roman', serif; font-weight: bold; font-size: 20px; color: var(--turq); letter-spacing: 2px; text-shadow: 0 0 12px rgba(47,212,181,0.4); }
  .logo-text small { display: block; font-size: 10px; color: var(--mint); letter-spacing: 3px; }
  
  .header-info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; color: var(--mint); font-family: "Courier New", monospace;
  }
  .chip.timer { cursor: pointer; }
  .chip.timer:hover { border-color: var(--turq); }
  .chip.ok { color: #2ecc71; }

  .main-container { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; }
  
  .name-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 15px 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
  }
  .name-block label { color: var(--gold); font-weight: bold; }
  .name-block input {
    flex: 1; min-width: 200px; padding: 10px 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    font-family: Georgia, serif; font-size: 16px; outline: none;
  }
  .name-block input:focus { border-color: var(--turq); }

  .condition-block {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    font-size: 15px; line-height: 1.6; color: var(--text);
  }
  .condition-block b { color: var(--gold); }

  .graph-wrap { background: #f2fbf8; border-radius: 12px; padding: 10px; margin: 15px 0; text-align: center; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .graph-wrap svg { min-width: 600px; max-width: 100%; height: auto; display: block; margin: 0 auto; }

  .task-card {
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); transition: 0.3s;
  }
  .task-card.solved-ok { border-color: #2ecc71; background: rgba(46, 204, 113, 0.05); }
  .task-card.solved-bad { border-color: var(--coral); background: rgba(255, 107, 107, 0.05); }

  .task-header {
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px;
    border-bottom: 1px solid rgba(47, 212, 181, 0.15); padding-bottom: 12px;
  }
  .task-num {
    background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27;
    font-weight: bold; font-size: 18px; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-family: "Courier New", monospace; flex-shrink: 0;
  }
  .task-title { font-size: 15px; color: var(--mint); font-weight: bold; padding-top: 8px; flex: 1; }
  .task-mark { font-size: 24px; margin-left: auto; }
  
  .task-question { font-size: 16px; line-height: 1.6; margin-bottom: 15px; }
  .task-question b { color: var(--gold); }

  .shop-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
  .shop-table th, .shop-table td { border: 1px solid var(--line); padding: 6px; text-align: center; }
  .shop-table th { background: rgba(47, 212, 181, 0.1); color: var(--mint); }

  .answer-row { display: flex; gap: 10px; margin-top: 15px; }
  .answer-row input {
    flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); font-size: 16px; font-family: "Courier New", monospace;
    outline: none; transition: 0.3s;
  }
  .answer-row input:focus { border-color: var(--turq); box-shadow: 0 0 10px rgba(47,212,181,0.2); }
  .answer-row input.disabled { opacity: 0.7; pointer-events: none; background: #061d1a; }
  .answer-row input.correct { border-color: #2ecc71; color: #2ecc71; }
  .answer-row input.wrong { border-color: var(--coral); color: var(--coral); }

  .correct-answer-note { margin-top: 15px; font-size: 14px; color: var(--coral); font-weight: bold; display: none; }
  .correct-answer-note.show { display: block; }

  .interactive-panel{background:rgba(47,212,181,0.08);border:1.5px dashed var(--turq);border-radius:12px;padding:14px 18px;margin-top:10px;}
  .selected-room-info{font-size:15px;color:var(--gold);font-weight:700;margin-bottom:10px;min-height:24px;}
  .selected-room-info.active{color:var(--mint);}
  .room-select-wrapper{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .room-select-wrapper label{font-size:15px;color:var(--gold);font-weight:700;}
  .room-select-wrapper select{flex:1;min-width:180px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font-family:Georgia,serif;font-size:15px;outline:none;cursor:pointer;}
  .room-select-wrapper select:focus{border-color:var(--turq);}
  .room-select-wrapper select:disabled{opacity:0.5;cursor:not-allowed;}
  .clickable-zone{cursor:pointer;fill:rgba(47,212,181,0.01);stroke:transparent;stroke-width:2;transition:all 0.2s;}
  .clickable-zone:hover{fill:rgba(127,255,212,0.15);stroke:var(--mint);stroke-dasharray:4,3;}
  .clickable-zone.selected{fill:rgba(127,255,212,0.25);stroke:var(--mint);stroke-dasharray:none;}
  .room-label{font-family:Georgia,serif;font-size:13px;font-weight:700;fill:var(--turq);text-anchor:middle;pointer-events:none;}
  .room-label.correct{fill:#2ecc71;}
  .room-label.wrong{fill:#ff6b6b;}

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; 
    background: rgba(17, 60, 56, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 15px 20px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; z-index: 10;
  }
  .btn {
    padding: 14px 20px; border: none; border-radius: 12px;
    font-family: Georgia, serif; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--turq), #1a9a82); color: #0b2b27; box-shadow: 0 4px 15px rgba(47,212,181,0.3); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(47,212,181,0.5); }
  .btn-gold { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }
  .btn-gold:hover { background: rgba(232, 196, 90, 0.1); }
  .btn-max { background: linear-gradient(135deg, #2fd4b5, #1a9a82); color: #0b2b27; }

  .summary-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px;
  }
  .summary-overlay.show { display: flex; }
  .summary-box {
    background: var(--bg); border: 2px solid var(--turq); border-radius: 18px;
    padding: 30px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .summary-title { font-size: 18px; color: var(--mint); letter-spacing: 2px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
  .summary-stats { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .summary-stat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .summary-stat .num { font-family: "Courier New", monospace; font-size: 36px; font-weight: bold; }
  .summary-stat .num.ok { color: #2ecc71; }
  .summary-stat .num.err { color: var(--coral); }
  .summary-stat .num.pct { color: var(--gold); }
  .summary-stat .lbl { font-size: 12px; color: #889fa8; text-transform: uppercase; }
  .summary-line { font-size: 15px; color: var(--text); font-style: italic; }

  @media (max-width: 600px) {
    .task-card { padding: 15px; }
    .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dots"><span>●</span><span>● ●</span><span>● ● ●</span><span>● ● ● ●</span></div>
    <div class="logo-text">ΤΕΤΡΑΚΤΥΣ<small>ШКОЛА МАТЕМАТИКИ</small></div>
  </div>
  <div class="header-info">
    <div class="chip" id="dateDisplay">📅 --.--.----</div>
    <div class="chip timer" id="timerDisplay" title="Клик — пауза/старт">⏱ 00:00</div>
    <div class="chip ok" id="scoreDisplay">✅ 0 / 5</div>
  </div>
</header>

<div class="main-container">
  <div class="name-block">
    <label>👤 Имя ученика:</label>
    <input type="text" id="studentName" placeholder="Введи имя и фамилию" autocomplete="off">
  </div>

  <div id="content"></div>
</div>

<div class="bottom-bar">
  <button class="btn btn-primary" onclick="checkAll()" id="btnCheck">✅ Проверить</button>
  <button class="btn btn-gold" onclick="startNew()">🔄 Сменить</button>
  <button class="btn btn-max" onclick="sendToMax()">💬 В Макс</button>
</div>

<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-box">
    <div class="summary-title">📊 Результат</div>
    <div class="summary-stats">
      <div class="summary-stat"><span class="num ok" id="statOk">0</span><span class="lbl">✅ верно</span></div>
      <div class="summary-stat"><span class="num err" id="statErr">0</span><span class="lbl">❌ неверно</span></div>
      <div class="summary-stat"><span class="num pct" id="statPercent">0%</span><span class="lbl">📊 процент</span></div>
    </div>
    <div class="summary-line" id="summaryLine">—</div>
    <button class="btn btn-primary" style="margin-top: 20px; width: 100%;" onclick="document.getElementById('summaryOverlay').classList.remove('show')">Закрыть</button>
  </div>
</div>

  const roomsList = ['санузел', 'коридор', 'кладовая', 'кухня', 'гостиная', 'спальня'];
  const roomForArea = pick(roomsList);
  const cellsArea = P.cells[roomForArea];
  const task2Correct = Math.round(cellsArea * 0.16 * 100) / 100;

  let roomA, roomB, correctPct;
  while (true) {
    roomA = pick(Object.keys(P.cells));
    roomB = pick(Object.keys(P.cells));
    if (roomA === roomB) continue;
    
    const areaA = P.cells[roomA] * 0.16;
    const areaB = P.cells[roomB] * 0.16;
    const pct = Math.abs(areaA - areaB) / areaB * 100;
    if (Math.abs(pct - Math.round(pct)) < 0.001 && pct > 0) {
      correctPct = Math.round(pct);
      break;
    }
  }
  
  const roomALabel = roomA;
  const roomBLabel = roomB;

  const isTile = Math.random() < 0.5;
  const room4 = pick(roomsList);
  const cells4 = P.cells[room4];
  let task4Correct, task4Text;
  if (isTile) {
    const tiles = Math.ceil(cells4); 
    task4Correct = Math.ceil(tiles / 12);
    task4Text = `Плитка для пола размером 40 см на 40 см продаётся в упаковках по 12 штук. Сколько упаковок плитки понадобилось, чтобы выложить пол ${room4 === 'коридор' ? 'коридора' : room4 === 'санузел' ? 'санузла' : room4 === 'кладовая' ? 'кладовой' : room4 === 'кухня' ? 'кухни' : room4 === 'гостиная' ? 'гостиной' : 'спальни'}?`;
  } else {
    const boards = Math.ceil(cells4); 
    task4Correct = Math.ceil(boards / 12);
    task4Text = `Паркетная доска размером 20 см на 80 см продаётся в упаковках по 12 штук. Сколько упаковок паркетной доски понадобилось, чтобы выложить пол ${room4 === 'коридор' ? 'коридора' : room4 === 'санузел' ? 'санузла' : room4 === 'кладовая' ? 'кладовой' : room4 === 'кухня' ? 'кухни' : room4 === 'гостиная' ? 'гостиной' : 'спальни'}?`;
  }

  const t5 = pick(TASK5_VARIANTS);
  const suitable = t5.table.filter(t5.filter);
  const costs = suitable.map(r => t5.calc(r));
  const task5Correct = Math.min(...costs);

  return {
    P, roleByDigit, roomForArea, task2Correct,
    roomALabel, roomBLabel, correctPct,
    task4Text, task4Correct,
    t5, task5Correct
  };
}

function wireInteractiveLabels() {
  selectedRoom = null;
  userLabels = {};
  const info = document.getElementById('selectedRoomInfo');
  if(info){ info.textContent = '👆 Выбери комнату на плане'; info.classList.remove('active'); }
  const sel = document.getElementById('roomSelect');
  if(sel){ sel.value = ''; sel.disabled = true; }

  const svg = document.querySelector('#content .graph-wrap svg');
  if(!svg) return;

  const texts = svg.querySelectorAll('text');
  texts.forEach(t => {
    const txt = t.textContent.trim();
    if(/^[1-8]$/.test(txt)){
      const cx = parseFloat(t.getAttribute('x'));
      const cy = parseFloat(t.getAttribute('y'));
      const zone = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      zone.setAttribute('cx', cx);
      zone.setAttribute('cy', cy);
      zone.setAttribute('r', 28);
      zone.setAttribute('class', 'clickable-zone');
      zone.setAttribute('data-digit', txt);
      svg.appendChild(zone);
    }
  });

  const zones = svg.querySelectorAll('.clickable-zone');
  zones.forEach(zone => {
    zone.addEventListener('click', (e) => {
      e.stopPropagation();
      zones.forEach(z => z.classList.remove('selected'));
      zone.classList.add('selected');
      selectedRoom = zone.dataset.digit;
      const info = document.getElementById('selectedRoomInfo');
      info.textContent = `Выбрана комната ${selectedRoom}. Выбери название:`;
      info.classList.add('active');
      const sel = document.getElementById('roomSelect');
      sel.disabled = false;
      sel.focus();
    });
  });

  if(sel){
    sel.addEventListener('change', function(){
      if(!selectedRoom || !this.value) return;
      const role = this.value;
      userLabels[selectedRoom] = role;
      this.value = '';
      this.disabled = true;
      zones.forEach(z => z.classList.remove('selected'));
      renderRoomLabel(selectedRoom, role);
      const info = document.getElementById('selectedRoomInfo');
      info.textContent = '👆 Выбери следующую комнату';
      info.classList.remove('active');
      selectedRoom = null;
    });
  }
}

function renderRoomLabel(digitStr, role) {
  const svg = document.querySelector('#content .graph-wrap svg');
  if(!svg) return;
  const old = svg.querySelector('.room-label[data-digit="' + digitStr + '"]');
  if(old) old.remove();
  let cx = null, cy = null;
  svg.querySelectorAll('text').forEach(t => {
    const txt = t.textContent.trim();
    if(txt === digitStr && cx === null){
      cx = parseFloat(t.getAttribute('x'));
      cy = parseFloat(t.getAttribute('y'));
    }
  });
  if(cx === null) return;
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', cx);
  label.setAttribute('y', cy + 38);
  label.setAttribute('class', 'room-label');
  label.setAttribute('data-digit', digitStr);
  label.textContent = role;
  svg.appendChild(label);
}

function checkInteractiveLabels(s) {
  const svg = document.querySelector('#content .graph-wrap svg');
  if(!svg) return false;
  const roleByDigitStr = {};
  for(const k in s.roleByDigit){
    roleByDigitStr[String(k)] = s.roleByDigit[k];
  }
  svg.querySelectorAll('.room-label').forEach(el => {
    el.classList.remove('correct', 'wrong');
  });
  let allOk = true;
  let filledCount = 0;
  for(let digit = 1; digit <= 8; digit++){
    const key = String(digit);
    const userRole = userLabels[key];
    const correctRole = roleByDigitStr[key];

    if(!userRole){ allOk = false; continue; }
    filledCount++;
    const labelEl = svg.querySelector('.room-label[data-digit="' + key + '"]');
    if(labelEl){
      if(userRole === correctRole) labelEl.classList.add('correct');
      else { labelEl.classList.add('wrong'); allOk = false; }
    }
  }
  if(filledCount < 8) allOk = false;
  return allOk;
}

function normAnswer(s){ return String(s||'').trim().replace(/\s+/g,'').replace(',','.').replace(/[°%кмминлГБгбрубсмкв]+$/gi,'').replace(/^0+(?=\d)/,''); }
function checkNumeric(userAns, correctAns){ const u = normAnswer(userAns); const c = normAnswer(correctAns); if(!u) return false; if(u === c) return true; const un = parseFloat(u), cn = parseFloat(c); return (!isNaN(un) && !isNaN(cn) && Math.abs(un - cn) < 0.01); }

function checkAll() {
  const name = document.getElementById('studentName').value.trim();
  if(!name){ alert('Введи имя ученика!'); return; }

  const s = currentState;
  let okCount = 0, errCount = 0;

  const task1Ok = checkInteractiveLabels(s);
  document.getElementById('mark-1').textContent = task1Ok ? '✅' : '❌';
  document.getElementById('task-1').classList.add(task1Ok ? 'solved-ok' : 'solved-bad');
  if(!task1Ok){
    const pairs = Object.keys(s.roleByDigit).map(d => d + ' — ' + s.roleByDigit[d]).join(', ');
    document.getElementById('note-1').innerHTML = 'Правильно: <b>' + pairs + '</b>';
    document.getElementById('note-1').classList.add('show');
  }
  if(task1Ok) okCount++; else errCount++;

  const answers = { 2: s.task2Correct, 3: s.correctPct, 4: s.task4Correct, 5: s.task5Correct };
  [2,3,4,5].forEach(n => {
    const inp = document.getElementById('ans-'+n);
    const val = inp.value.trim();
    const isOk = checkNumeric(val, answers[n]);
    inp.classList.add(isOk ? 'correct' : 'wrong');
    inp.disabled = true;
    document.getElementById('mark-'+n).textContent = isOk ? '✅' : '❌';
    document.getElementById('task-'+n).classList.add(isOk ? 'solved-ok' : 'solved-bad');
    if(!isOk){
      document.getElementById('note-'+n).innerHTML = 'Правильный ответ: <b>' + fmtNum(answers[n]) + '</b>';
      document.getElementById('note-'+n).classList.add('show');
    }
    if(isOk) okCount++; else errCount++;
  });

  const sel = document.getElementById('roomSelect');
  if(sel) sel.disabled = true;

  const percent = Math.round(okCount / 5 * 100);
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statErr').textContent = errCount;
  document.getElementById('statPercent').textContent = percent + '%';
  document.getElementById('summaryLine').textContent = percent >= 80 ? '🌟 Отлично!' : percent >= 50 ? '👍 Хорошо, но можно лучше' : '📚 Стоит повторить';
  document.getElementById('summaryOverlay').classList.add('show');
  document.getElementById('scoreDisplay').textContent = `✅ ${okCount} / 5`;
  
  const btn = document.getElementById('btnCheck');
  btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Проверено';
}

function sendToMax() {
  const name = document.getElementById('studentName').value.trim() || 'Без имени';
  let text = `🏠 ТРЕНАЖЕР · Квартира\nУченик: ${name}\nДата: ${new Date().toLocaleString('ru-RU')}\n--------------------------------\n\n`;
  let okCount = 0;
  const s = currentState;
  const answers = { 1: 'по плану', 2: s.task2Correct, 3: s.correctPct, 4: s.task4Correct, 5: s.task5Correct };

  for(let i = 1; i <= 5; i++) {
    if (i === 1) {
      const isOk = checkInteractiveLabels(s);
      if(isOk) { okCount++; text += `✅ Задача 1. Комнаты подписаны верно\n`; }
      else { text += `❌ Задача 1. Комнаты подписаны неверно\n`; }
    } else {
      const userAns = document.getElementById('ans-'+i).value.trim();
      const isOk = checkNumeric(userAns, answers[i]);
      if(userAns !== '') {
        if(isOk) { okCount++; text += `✅ Задача ${i}. Ответ: ${userAns} (верно)\n`; }
        else { text += `❌ Задача ${i}. Ответ: ${userAns} (правильный: ${fmtNum(answers[i])})\n`; }
      } else {
        text += `— Задача ${i}. (не решено)\n`;
      }
    }
  }
  text += `\n✅ Итог: ${okCount} из 5 верно`;
  navigator.clipboard.writeText(text).then(() => {
    alert('Отчет скопирован! Открываем чат Макс...');
    window.open('https://max.ru/u/f9LHodD0cOLjga5OFLMq8VyyMVxwRMnAtUTfKxnMebvnxW-IcLDiq4PIfes', '_blank');
  }).catch(err => alert('Ошибка копирования: ' + err));
}

let timerInterval, timerSeconds = 0, isTimerRunning = true;
window.onload = () => {
  const d = new Date();
  document.getElementById('dateDisplay').textContent = '📅 ' + d.toLocaleDateString('ru-RU');
  timerInterval = setInterval(() => {
    if (isTimerRunning) {
      timerSeconds++;
      const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const s = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `⏱ ${m}:${s}`;
    }
  }, 1000);
  document.getElementById('timerDisplay').onclick = function() {
    isTimerRunning = !isTimerRunning;
    this.style.opacity = isTimerRunning ? 1 : 0.5;
  };
  const savedName = localStorage.getItem('dz_kvartira_name');
  if(savedName) document.getElementById('studentName').value = savedName;
  document.getElementById('studentName').addEventListener('input', (e) => {
    localStorage.setItem('dz_kvartira_name', e.target.value);
  });
  startNew();
};
